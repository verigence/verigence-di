[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verigence-di"
version = "0.1.0"
description = "Verigence Document Intelligence — backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "aioboto3>=13.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.8.0",
    "Pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
    "pypdf>=4.2.0",
    "python-magic>=0.4.27",
    "openpyxl>=3.1.5",
    "apscheduler>=3.10.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.5.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-dateutil",
    "types-boto3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verigence"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = [
    "E501",
    "B008",
    "TC001",
    "TC002",
    "TC003",
    "F841",
    "UP042",
    "UP046",
    "UP007",
    "UP035",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# PR #4 established the measured repository baseline (~49%) as the hard floor.
# Keep the full suite gated without reviving the previously impossible 70% threshold.
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=49"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/alembic/*"]
