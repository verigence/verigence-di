[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verigence-di"
version = "0.1.0"
description = "Verigence Document Intelligence — backend service"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",

    # Object storage (S3-compatible: R2 + MinIO)
    "boto3>=1.34.0",
    "aioboto3>=13.0.0",

    # Auth — Security JWT verification
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",

    # Google Document AI
    "google-cloud-documentai>=2.29.0",

    # Image / PDF quality checks
    "Pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
    "pypdf>=4.2.0",
    "python-magic>=0.4.27",

    # Scheduling
    "apscheduler>=3.10.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.5.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-dateutil",
    "types-boto3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verigence"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = [
    "E501",    # line too long — handled by formatter
    "B008",    # Depends() in function defaults — idiomatic FastAPI pattern
    "TC001",   # move app import into TYPE_CHECKING — breaks Pydantic runtime validation
    "TC002",   # move third-party import into TYPE_CHECKING — breaks FastAPI/SQLAlchemy runtime use
    "TC003",   # move stdlib import into TYPE_CHECKING — breaks Pydantic/FastAPI runtime annotation
    "F841",    # local variable assigned but never used — we clean these up manually
    "UP042",   # prefer StrEnum — str+Enum is required for Pydantic v2 serialization compat
    "UP007",   # use X|Y union — keep Union for clarity in complex storage type hints
    "UP035",   # AsyncIterator from collections.abc — keep typing import for now
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Current measured repository baseline is ~49%. Keep this as an enforced floor
# so coverage cannot regress while the test backlog is expanded toward 70%.
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=49"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/alembic/*"]
