version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: verigence-di-postgres
    environment:
      POSTGRES_DB: verigence_di
      POSTGRES_USER: verigence
      POSTGRES_PASSWORD: verigence_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verigence -d verigence_di"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: verigence-di-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the dev bucket automatically on startup
  minio-init:
    image: minio/mc:latest
    container_name: verigence-di-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/verigence-di-dev;
        echo 'Bucket ready';
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: verigence-di-api
    command: uvicorn verigence.di.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    env_file:
      - ./infra/.env.local
    environment:
      - DI_ENV=local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
