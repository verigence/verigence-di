          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
        eodRetryEnabled:
          type: boolean
        uploadTimeoutMinutes:
          type: integer
          minimum: 1
        maxUploadBytes:
          type: integer
          minimum: 1
        allowedMimeTypes:
          type: array
          minItems: 1
          items:
            type: string
        activeRetentionPolicyId:
          type:
          - string
          - 'null'
          format: uuid
        whatsappSubjectReferencePrefix:
          type: string
          minLength: 1
        classificationAcceptanceScore:
          type: number
          minimum: 0
          maximum: 100
          description: Tenant calibration for automatic document-type classification
            acceptance. Must be explicitly configured before activation.
        subjectMatchingMinConfidence:
          type: number
          minimum: 0
          maximum: 100
          description: Minimum field confidence allowed for automatic WhatsApp Subject
            matching from an extracted identifier. Must be explicitly configured before
            activation.
