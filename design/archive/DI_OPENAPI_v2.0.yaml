      type: object
      required:
      - tenantId
      - timezoneName
      - eodRetryLocalTime
      - eodRetryEnabled
      - uploadTimeoutMinutes
      - maxUploadBytes
      - allowedMimeTypes
      - whatsappSubjectReferencePrefix
      - classificationAcceptanceScore
      - subjectMatchingMinConfidence
      properties:
        tenantId:
          type: string
