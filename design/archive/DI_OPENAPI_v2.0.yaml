openapi: 3.1.0
info:
  title: Verigence Document Intelligence API
  version: 2.0.0
  description: 'Baselined Phase-1 vendor-neutral REST API.

    Primary business lookup is tenantId + subjectId.

    Machine lifecycle is Upload -> Process -> Confirm.

    Each successfully extracted document has confidenceScore 0-100.

    confidenceScore > 90.00 => humanVerificationStatus OPTIONAL; confidenceScore <=
    90.00 => MANDATORY.

    verificationState separately records NOT_VERIFIED or VERIFIED.

    No primary document-only status discovery endpoint and no outbound event API.


    Requirement classification is derived from the Subject''s active Requirement Profile
    at enquiry time and is not persisted as authoritative document state.'
servers:
- url: https://{host}
  variables:
    host:
      default: document-intelligence.example
security:
- bearerAuth: []
tags:
- name: Subject Documents
- name: Human Verification
- name: Operations
- name: Requirement Configuration
- name: Extraction Configuration
- name: Tenant Configuration
- name: Subject Matching
- name: External Links
- name: WhatsApp
- name: Document Types
paths:
  /v1/tenants/{tenantId}/subjects/{subjectId}/documents:
    post:
      tags:
      - Subject Documents
      summary: Upload one logical document for a Subject
      operationId: uploadSubjectDocument
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - sourceChannel
              properties:
                file:
                  type: string
                  format: binary
                  description: Raw binary content. Normal upload does not use Base64.
                sourceChannel:
                  type: string
                  enum:
                  - MOBILE
                  - WEB
                  - API
                documentTypeKey:
                  type: string
                  maxLength: 120
                  description: Optional active supported Document Type hint. Omit
                    it to let processing classify the document.
                capturedAt:
                  type: string
                  format: date-time
                sourceReference:
                  type: string
                  maxLength: 500
                replacesDocumentId:
                  type: string
                  format: uuid
                externalEntityLinks:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExternalEntityLinkInput'
      responses:
        '201':
          description: Document resource created. Upload/quality processing state
            is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: 'Subject ID is supplied by the caller. Requirement-profile assignment
        is not required to upload; if no active Requirement Profile exists, upload/processing
        continues and completeness enquiry reports REQUIREMENT_PROFILE_NOT_ASSIGNED.
        A supported type outside the profile is accepted as ADDITIONAL.

        A documentTypeKey supplied by the caller is a non-authoritative hint: the
        classifier must verify it; a valid hint never bypasses machine classification/validation.'
    get:
      tags:
      - Subject Documents
      summary: Get the full requirement and document state for a Subject
      operationId: getSubjectDocuments
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: Configured mandatory/optional requirements, actual documents,
            additional documents and verification state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDocumentView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      description: Primary Subject-centric enquiry. Returns configured requirements
        when assigned, all actual documents, confidence and human-verification fields.
  /v1/tenants/{tenantId}/subjects/{subjectId}/document-exceptions:
    get:
      tags:
      - Subject Documents
      summary: List active requirement and document exceptions for one Subject
      operationId: getSubjectDocumentExceptions
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - in: query
        name: state
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RequirementState'
        style: form
        explode: true
        description: Defaults to MISSING, NOT_FIT, CORRUPT, UPLOAD_FAILED, RETRY_PENDING
          and FAILED.
      - in: query
        name: includeResolvedHistory
        schema:
          type: boolean
          default: false
        description: Include historical exceptions that have already been superseded/replaced.
      responses:
        '200':
          description: Exception list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationalException'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      description: Returns missing configured requirements plus current bad/upload-failed/retry-pending/failed
        actual Documents for the Subject. Historical bad attempts already replaced
        are excluded by default.
  /v1/tenants/{tenantId}/subjects/{subjectId}/documents/{documentId}:
    get:
      tags:
      - Subject Documents
      summary: Get one actual document within the Tenant + Subject boundary
      operationId: getSubjectDocument
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document metadata/state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/subjects/{subjectId}/documents/{documentId}/content:
    get:
      tags:
      - Subject Documents
      summary: Retrieve original document bytes
      operationId: getSubjectDocumentContent
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Original binary content.
          headers:
            X-Content-SHA256:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/subjects/{subjectId}/documents/{documentId}/fields:
    get:
      tags:
      - Subject Documents
      summary: Retrieve machine extraction and current accepted field values
      operationId: getSubjectDocumentFields
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Extraction result and field lineage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtractionResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/subjects/{subjectId}/documents/{documentId}/verification:
    post:
      tags:
      - Human Verification
      summary: Record human verification and optional field corrections
      operationId: verifySubjectDocument
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanVerificationRequest'
      responses:
        '201':
          description: Verification appended and current accepted values updated where
            corrections were supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanVerificationResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: Available only for a machine-CONFIRMED Document. Phase 1 allows
        one successful Human Verification action per Document; all corrections must
        be supplied in that action. If verificationState is already VERIFIED, return
        HTTP 409 INVALID_DOCUMENT_STATE.
  /v1/tenants/{tenantId}/subjects/{subjectId}/documents/{documentId}/entity-links:
    get:
      tags:
      - External Links
      summary: List generic external entity links for a document
      operationId: getDocumentEntityLinks
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Active external links.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalEntityLink'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - External Links
      summary: Add a generic external entity link
      operationId: addDocumentEntityLink
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalEntityLinkInput'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEntityLink'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/verification-queue:
    get:
      tags:
      - Human Verification
      summary: List confirmed documents awaiting human verification
      operationId: getVerificationQueue
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: query
        name: humanVerificationStatus
        schema:
          $ref: '#/components/schemas/HumanVerificationStatus'
        description: Defaults to MANDATORY.
      - in: query
        name: subjectId
        schema:
          type: string
          maxLength: 240
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Verification queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDocuments'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/document-exceptions:
    get:
      tags:
      - Operations
      summary: Tenant-wide document exception list
      operationId: getTenantDocumentExceptions
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: query
        name: subjectId
        schema:
          type: string
          maxLength: 240
      - in: query
        name: uploadedByActorId
        schema:
          type: string
          maxLength: 160
      - in: query
        name: state
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RequirementState'
        style: form
        explode: true
      - in: query
        name: includeResolvedHistory
        schema:
          type: boolean
          default: false
        description: Include historical exceptions already superseded/replaced.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tenant-wide exceptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOperationalExceptions'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      description: Tenant-wide active exception list covering missing configured requirements
        and actual Document exceptions. Historical replaced attempts are excluded
        by default.
  /v1/tenants/{tenantId}/upload-quality:
    get:
      tags:
      - Operations
      summary: Upload-quality metrics grouped by uploader
      operationId: getUploadQuality
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: query
        name: uploadedByActorId
        schema:
          type: string
          maxLength: 160
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Upload-quality summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadQualitySummary'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/unassigned-documents:
    get:
      tags:
      - WhatsApp
      summary: List tenant-resolved documents not yet assigned to a Subject
      operationId: getUnassignedDocuments
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Unassigned documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDocuments'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/unassigned-documents/{documentId}/subject:
    put:
      tags:
      - WhatsApp
      summary: Assign an unassigned tenant document to a Subject
      operationId: assignDocumentSubject
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subjectId
              properties:
                subjectId:
                  type: string
                  maxLength: 240
      responses:
        '200':
          description: Subject assigned and requirement classification recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/subjects/{subjectId}/requirement-profile:
    put:
      tags:
      - Requirement Configuration
      summary: Assign one published Requirement Profile version to a Subject
      operationId: assignRequirementProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requirementProfileId
              properties:
                requirementProfileId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Assignment active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectRequirementAssignment'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/document-requirement-profiles:
    get:
      tags:
      - Requirement Configuration
      summary: List Requirement Profile versions
      operationId: listRequirementProfiles
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequirementProfile'
    post:
      tags:
      - Requirement Configuration
      summary: Create a DRAFT Requirement Profile version
      operationId: createRequirementProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequirementProfileRequest'
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementProfile'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/document-requirement-profiles/{profileId}/publish:
    post:
      tags:
      - Requirement Configuration
      summary: Publish an immutable Requirement Profile version
      operationId: publishRequirementProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Published profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementProfile'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      description: Publishes the DRAFT version and atomically retires the previously
        published version of the same profileKey, if any. Existing Subject assignments
        to an older immutable version remain valid until explicitly reassigned.
  /v1/tenants/{tenantId}/document-types:
    get:
      tags:
      - Extraction Configuration
      summary: List effective global + tenant Document Types
      operationId: listDocumentTypes
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Document Types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentType'
    post:
      tags:
      - Extraction Configuration
      summary: Create a tenant-owned Document Type
      operationId: createDocumentType
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentTypeRequest'
      responses:
        '201':
          description: DRAFT Document Type created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentType'
        '409':
          $ref: '#/components/responses/Problem'
      description: Creates a tenant-owned Document Type in DRAFT state. Publishing
        its first valid Extraction Profile activates the Document Type atomically;
        no separate activation step is required.
  /v1/tenants/{tenantId}/document-types/{documentTypeKey}/extraction-profiles:
    get:
      tags:
      - Extraction Configuration
      summary: List Extraction Profile versions for a Document Type
      operationId: listExtractionProfiles
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DocumentTypeKey'
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtractionProfile'
    post:
      tags:
      - Extraction Configuration
      summary: Create a DRAFT Extraction Profile version
      description: Missing field keys are created as tenant-owned canonical fields
        from the supplied datatype/display name; incompatible existing datatype returns
        409. Rule keys must exist in the platform catalogs.
      operationId: createExtractionProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DocumentTypeKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExtractionProfileRequest'
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionProfile'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/document-types/{documentTypeKey}/extraction-profiles/{profileId}/publish:
    post:
      tags:
      - Extraction Configuration
      summary: Publish an immutable Extraction Profile version
      operationId: publishExtractionProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DocumentTypeKey'
      - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Published profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionProfile'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      description: Publishes the DRAFT version and atomically retires the previously
        published profile for the same Document Type and scope, if any. Existing Processing
        Runs retain their historical profile reference.
  /v1/tenants/{tenantId}/settings:
    get:
      tags:
      - Tenant Configuration
      summary: Get Document Intelligence tenant settings
      operationId: getTenantSettings
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
    put:
      tags:
      - Tenant Configuration
      summary: Replace Document Intelligence tenant settings
      operationId: putTenantSettings
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutTenantSettingsRequest'
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/retention-policies:
    get:
      tags:
      - Tenant Configuration
      summary: List retention policies
      operationId: listRetentionPolicies
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetentionPolicy'
    post:
      tags:
      - Tenant Configuration
      summary: Create a retention policy
      operationId: createRetentionPolicy
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRetentionPolicyRequest'
      responses:
        '201':
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
  /v1/tenants/{tenantId}/retention-policies/{retentionPolicyId}:
    put:
      tags:
      - Tenant Configuration
      summary: Update an existing retention policy
      operationId: updateRetentionPolicy
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: retentionPolicyId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRetentionPolicyRequest'
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/subjects/{subjectId}/identifiers:
    post:
      tags:
      - Subject Matching
      summary: Register a verified Subject identifier usable for deterministic WhatsApp
        matching
      operationId: addSubjectIdentifier
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectIdentifierInput'
      responses:
        '201':
          description: Identifier stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectIdentifier'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/whatsapp/sender-mappings:
    post:
      tags:
      - Subject Matching
      summary: Create/update an exact WhatsApp sender-to-Subject mapping
      operationId: putWhatsappSenderMapping
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappSenderMappingInput'
      responses:
        '200':
          description: Mapping active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappSenderMapping'
  /v1/system/whatsapp/routes:
    post:
      tags:
      - WhatsApp
      summary: Configure a WhatsApp destination/account route to Tenant and SYSTEM
        actor
      operationId: putWhatsappRoute
      security:
      - systemBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappRouteInput'
      responses:
        '200':
          description: Route active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappRoute'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/integrations/whatsapp/webhook:
    post:
      tags:
      - WhatsApp
      summary: Receive inbound WhatsApp message/media webhook
      operationId: whatsappWebhook
      security: []
      description: 'The adapter validates provider webhook authenticity before processing.

        Tenant is resolved from configured route. Subject may remain unassigned.

        Uploader actor is the configured SYSTEM actor, while sender provenance is
        stored separately.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Provider webhook payload. It is interpreted only inside
                the WhatsApp adapter.
      responses:
        '200':
          description: Webhook acknowledged.
  /v1/system/whatsapp/quarantine:
    get:
      tags:
      - WhatsApp
      summary: List WhatsApp intake events for which Tenant routing failed
      operationId: getWhatsappQuarantine
      security:
      - systemBearer: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Quarantined intake items.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                - pageSize
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WhatsappQuarantineItem'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
  /v1/system/whatsapp/quarantine/{quarantineId}/replay:
    post:
      tags:
      - WhatsApp
      summary: Replay a quarantined WhatsApp intake item after Tenant routing is corrected
      operationId: replayWhatsappQuarantine
      security:
      - systemBearer: []
      parameters:
      - in: path
        name: quarantineId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Replay accepted for normal intake processing.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      description: Replays the quarantined event only after its original destination/account
        resolves through an ACTIVE configured WhatsApp route. The caller cannot supply
        a Tenant ID; Tenant is re-derived from the corrected route to prevent arbitrary
        cross-Tenant assignment.
  /v1/tenants/{tenantId}/unassigned-documents/{documentId}:
    get:
      tags:
      - WhatsApp
      summary: Get one tenant-resolved but Subject-unassigned document
      operationId: getUnassignedDocument
      parameters: &id001
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Unassigned Document metadata/state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/unassigned-documents/{documentId}/content:
    get:
      tags:
      - WhatsApp
      summary: Retrieve original bytes for an unassigned document
      operationId: getUnassignedDocumentContent
      parameters: *id001
      responses:
        '200':
          description: Original binary content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/unassigned-documents/{documentId}/fields:
    get:
      tags:
      - WhatsApp
      summary: Retrieve extraction result for an unassigned document
      operationId: getUnassignedDocumentFields
      parameters: *id001
      responses:
        '200':
          description: Extraction result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtractionResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/document-requirement-profiles/{profileId}:
    get:
      tags:
      - Requirement Profiles
      summary: Get one Requirement Profile version
      operationId: getRequirementProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - &id002
        in: path
        name: profileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Requirement Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementProfile'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - Requirement Profiles
      summary: Replace the contents of a DRAFT Requirement Profile version
      operationId: updateDraftRequirementProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequirementProfileDraftRequest'
      responses:
        '200':
          description: Updated DRAFT profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementProfile'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: Updates only a DRAFT Requirement Profile. profileKey and version
        are immutable; published/retired versions cannot be edited.
  /v1/tenants/{tenantId}/document-types/{documentTypeKey}/extraction-profiles/{profileId}:
    get:
      tags:
      - Extraction Profiles
      summary: Get one Extraction Profile version
      operationId: getExtractionProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - &id003
        $ref: '#/components/parameters/DocumentTypeKey'
      - *id002
      responses:
        '200':
          description: Extraction Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionProfile'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - Extraction Profiles
      summary: Replace the contents of a DRAFT Extraction Profile version
      operationId: updateDraftExtractionProfile
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - *id003
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExtractionProfileDraftRequest'
      responses:
        '200':
          description: Updated DRAFT profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionProfile'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      description: Updates only a DRAFT Extraction Profile. documentTypeKey, scope
        and version are immutable; published/retired versions cannot be edited.
  /v1/tenants/{tenantId}/document-types/{documentTypeKey}:
    get:
      tags:
      - Document Types
      summary: Get one effective Tenant Document Type
      operationId: getDocumentType
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - *id003
      responses:
        '200':
          description: Document Type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentType'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - Document Types
      summary: Update a Tenant-owned Document Type
      operationId: updateDocumentType
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentTypeRequest'
      responses:
        '200':
          description: Updated Document Type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentType'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      description: Updates mutable metadata for the existing Document Type. documentTypeKey
        and scope are immutable.
  /v1/tenants/{tenantId}/normalization-rules:
    get:
      tags:
      - Extraction Profiles
      summary: List approved reusable rule catalog entries
      operationId: listNormalizationRules
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Rule catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleCatalogItem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/validation-rules:
    get:
      tags:
      - Extraction Profiles
      summary: List approved reusable rule catalog entries
      operationId: listValidationRules
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Rule catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleCatalogItem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/quality-policy:
    get:
      tags:
      - Configuration
      summary: Get Tenant upload-quality policy
      operationId: getQualityPolicy
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Quality policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityPolicy'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - Configuration
      summary: Replace Tenant upload-quality policy
      operationId: putQualityPolicy
      description: Replaces the governed rule/parameter set used by the deterministic
        upload quality gate. Exact rule parameters are configuration; no Python code
        change is required.
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutQualityPolicyRequest'
      responses:
        '200':
          description: Updated quality policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityPolicy'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/quality-rules:
    get:
      tags:
      - Configuration
      summary: List approved upload-quality rule definitions
      operationId: listQualityRules
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Quality rule catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QualityRuleCatalogItem'
  /v1/tenants/{tenantId}/subjects/{subjectId}/documents/{documentId}/quality-results:
    get:
      tags:
      - Documents
      summary: Get deterministic upload-quality rule results
      operationId: getSubjectDocumentQuality
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Quality results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentQualityResult'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/unassigned-documents/{documentId}/quality-results:
    get:
      tags:
      - Documents
      summary: Get deterministic upload-quality rule results
      operationId: getUnassignedDocumentQuality
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Quality results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentQualityResult'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/system/whatsapp/quarantine/{quarantineId}/discard:
    post:
      tags:
      - WhatsApp
      summary: Discard a quarantined WhatsApp intake item
      operationId: discardWhatsappQuarantine
      security:
      - systemBearer: []
      description: Marks an unresolved quarantine item DISCARDED, deletes its temporary
        media through the system StorageAdapter, and appends a system audit event.
        A RESOLVED/DISCARDED item cannot be discarded again.
      parameters:
      - in: path
        name: quarantineId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Quarantine item discarded.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    systemBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SubjectId:
      in: path
      name: subjectId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 240
    DocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      in: path
      name: profileId
      required: true
      schema:
        type: string
        format: uuid
    DocumentTypeKey:
      in: path
      name: documentTypeKey
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 240
    DeviceId:
      in: header
      name: X-Device-Id
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Required by policy for MOBILE/WEB user uploads where registered-device
        control is enabled.
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    UploadStatus:
      type: string
      enum:
      - RECEIVING
      - VALIDATING
      - FIT
      - NOT_FIT
      - CORRUPT
      - UPLOAD_FAILED
    ProcessingStatus:
      type: string
      enum:
      - NOT_STARTED
      - PROCESSING
      - RETRY_PENDING
      - PROCESSED
      - FAILED
    ConfirmationStatus:
      type: string
      enum:
      - PENDING
      - CONFIRMED
      - NOT_CONFIRMED
    RequirementClassification:
      type: string
      enum:
      - MANDATORY
      - OPTIONAL
      - ADDITIONAL
    RequirementState:
      type: string
      enum:
      - MISSING
      - UPLOADED
      - NOT_FIT
      - CORRUPT
      - UPLOAD_FAILED
      - PROCESSING
      - RETRY_PENDING
      - FAILED
      - CONFIRMED
    Document:
      type: object
      required:
      - tenantId
      - documentId
      - sourceChannel
      - uploadedByActorType
      - uploadedByActorId
      - uploadStatus
      - processingStatus
      - confirmationStatus
      - verificationState
      - registeredAtUtc
      properties:
        tenantId:
          type: string
        subjectId:
          type:
          - string
          - 'null'
        documentId:
          type: string
          format: uuid
        originalStorageId:
          type:
          - string
          - 'null'
          format: uuid
          description: Provider-neutral logical storage identity for the immutable
            ORIGINAL artifact. Null until original storage finalization completes.
        documentTypeKey:
          type:
          - string
          - 'null'
        requirementClassification:
          oneOf:
          - $ref: '#/components/schemas/RequirementClassification'
          - type: 'null'
          description: Derived from the Subject's active Requirement Profile at enquiry
            time; not authoritative stored Document state.
        sourceChannel:
          type: string
          enum:
          - MOBILE
          - WEB
          - API
          - WHATSAPP
        uploadedByActorType:
          type: string
          enum:
          - USER
          - SYSTEM
          - SERVICE
        uploadedByActorId:
          type: string
        sourceDeviceId:
          type:
          - string
          - 'null'
        capturedAt:
          type:
          - string
          - 'null'
          format: date-time
        sourceEventAt:
          type:
          - string
          - 'null'
          format: date-time
        registeredAtUtc:
          type: string
          format: date-time
        originalFilename:
          type:
          - string
          - 'null'
        declaredMimeType:
          type:
          - string
          - 'null'
        detectedMimeType:
          type:
          - string
          - 'null'
        fileSizeBytes:
          type:
          - integer
          - 'null'
          minimum: 0
        contentHashSha256:
          type:
          - string
          - 'null'
          minLength: 64
          maxLength: 64
        duplicateOfDocumentId:
          type:
          - string
          - 'null'
          format: uuid
        uploadStatus:
          $ref: '#/components/schemas/UploadStatus'
        uploadIssueCode:
          type:
          - string
          - 'null'
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        processingFailureCode:
          type:
          - string
          - 'null'
        confirmationStatus:
          $ref: '#/components/schemas/ConfirmationStatus'
        confidenceScore:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
          description: 0-100 machine extraction confidence. Null until successful
            extraction/confirmation.
        verificationThresholdApplied:
          type:
          - number
          - 'null'
          minimum: 90.0
          maximum: 90.0
          description: Fixed Phase-1 product threshold. 90.00 when CONFIRMED; null
            before confirmation.
        humanVerificationStatus:
          oneOf:
          - $ref: '#/components/schemas/HumanVerificationStatus'
          - type: 'null'
          description: 'Product-facing verification status derived from confidence
            threshold: OPTIONAL or MANDATORY. Null until confirmation.'
        verificationState:
          $ref: '#/components/schemas/VerificationState'
          description: Whether human verification has actually been completed.
        replacesDocumentId:
          type:
          - string
          - 'null'
          format: uuid
        replacedByDocumentId:
          type:
          - string
          - 'null'
          format: uuid
        contentState:
          type: string
          enum:
          - AVAILABLE
          - PURGED
        retentionUntilUtc:
          type:
          - string
          - 'null'
          format: date-time
        retentionDisposition:
          type: string
          enum:
          - PURGE_CONTENT
          - KEEP_CONTENT
    RequirementItem:
      type: object
      required:
      - documentTypeKey
      - requirementClassification
      - minimumCount
      - state
      - documents
      properties:
        documentTypeKey:
          type: string
        displayName:
          type: string
        requirementClassification:
          type: string
          enum:
          - MANDATORY
          - OPTIONAL
        minimumCount:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/RequirementState'
        confirmedCount:
          type: integer
          minimum: 0
        verifiedCount:
          type: integer
          minimum: 0
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
    SubjectDocumentSummary:
      type: object
      properties:
        mandatoryTotal:
          type: integer
          minimum: 0
        mandatoryConfirmed:
          type: integer
          minimum: 0
        mandatoryVerified:
          type: integer
          minimum: 0
        mandatoryOutstanding:
          type: integer
          minimum: 0
        mandatoryVerificationPending:
          type: integer
          minimum: 0
        optionalTotal:
          type: integer
          minimum: 0
        additionalDocumentCount:
          type: integer
          minimum: 0
        unclassifiedDocumentCount:
          type: integer
          minimum: 0
    SubjectDocumentView:
      type: object
      required:
      - tenantId
      - subjectId
      - configurationStatus
      - requirementProfile
      - summary
      - requirements
      - additionalDocuments
      - unclassifiedDocuments
      properties:
        tenantId:
          type: string
        subjectId:
          type: string
        requirementProfile:
          oneOf:
          - $ref: '#/components/schemas/RequirementProfileReference'
          - type: 'null'
        summary:
          $ref: '#/components/schemas/SubjectDocumentSummary'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RequirementItem'
        additionalDocuments:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        unclassifiedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        configurationStatus:
          $ref: '#/components/schemas/SubjectConfigurationStatus'
    ExtractedField:
      type: object
      required:
      - fieldKey
      - foundStatus
      - humanCorrected
      properties:
        fieldKey:
          type: string
        displayName:
          type: string
        foundStatus:
          type: string
          enum:
          - FOUND
          - NOT_FOUND
          - AMBIGUOUS
          - ERROR
        rawValue: {}
        normalizedValue: {}
        machineConfidenceScore:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        currentAcceptedValue: {}
        currentValueSource:
          type:
          - string
          - 'null'
          enum:
          - MACHINE
          - HUMAN
          - EXTERNAL
          - null
        pageNo:
          type:
          - integer
          - 'null'
          minimum: 1
        evidenceRegion:
          type:
          - object
          - 'null'
        humanCorrected:
          type: boolean
        sourceExtractedFactId:
          type:
          - string
          - 'null'
          format: uuid
        sourceVerificationId:
          type:
          - string
          - 'null'
          format: uuid
          description: Present when the current accepted value comes from a Human
            Verification correction.
    DocumentExtractionResult:
      type: object
      required:
      - documentId
      - confirmationStatus
      - verificationState
      - fields
      properties:
        documentId:
          type: string
          format: uuid
        processingRunId:
          type:
          - string
          - 'null'
          format: uuid
          description: Current successful Processing Run used for this extraction
            result.
        extractionProfileId:
          type:
          - string
          - 'null'
          format: uuid
        extractionProfileVersion:
          type:
          - integer
          - 'null'
        confidenceScore:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        verificationThresholdApplied:
          type:
          - number
          - 'null'
          minimum: 90.0
          maximum: 90.0
          description: Fixed Phase-1 product threshold. 90.00 when CONFIRMED; null
            before confirmation.
        humanVerificationStatus:
          oneOf:
          - $ref: '#/components/schemas/HumanVerificationStatus'
          - type: 'null'
          description: OPTIONAL or MANDATORY. Null until machine confirmation.
        verificationState:
          $ref: '#/components/schemas/VerificationState'
          description: NOT_VERIFIED or VERIFIED.
        confirmationStatus:
          $ref: '#/components/schemas/ConfirmationStatus'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedField'
    FieldCorrection:
      type: object
      required:
      - fieldKey
      - correctedValue
      properties:
        fieldKey:
          type: string
        correctedValue: {}
    HumanVerificationRequest:
      type: object
      properties:
        remarks:
          type: string
        fieldCorrections:
          type: array
          items:
            $ref: '#/components/schemas/FieldCorrection'
    HumanVerificationResult:
      type: object
      required:
