name: One-shot Gemini auth diagnostic

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-gemini-auth-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: di-dev
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - run: npm install --global @railway/cli
      - name: Inspect persisted Gemini key and worker deployment safely
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service di-worker --json >/dev/null
          railway variable list --service di-api --environment dev --json >/tmp/api-vars.json
          railway variable list --service di-worker --environment dev --json >/tmp/worker-vars.json
          railway deployment list --service di-worker --environment dev --limit 3 --json >/tmp/worker-deployments.json
          python - <<'PY'
          import hashlib
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          api=json.loads(Path('/tmp/api-vars.json').read_text())
          worker=json.loads(Path('/tmp/worker-vars.json').read_text())
          deployments=json.loads(Path('/tmp/worker-deployments.json').read_text())
          api_key=str(api.get('DI_DOCAI_GEMINI_API_KEY') or '')
          worker_key=str(worker.get('DI_DOCAI_GEMINI_API_KEY') or '')

          def fp(value: str) -> str:
              return hashlib.sha256(value.encode()).hexdigest()[:12] if value else 'MISSING'

          def family(value: str) -> str:
              if value.startswith('AIza'):
                  return 'STANDARD_AIZA'
              if value.startswith('AQ.') or value.startswith('AQ'):
                  return 'AUTH_AQ'
              return 'OTHER' if value else 'MISSING'

          def probe(key: str):
              if not key:
                  return 0, 'NO_KEY'
              req=urllib.request.Request(
                  'https://generativelanguage.googleapis.com/v1beta/models',
                  headers={'x-goog-api-key': key},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, 'OK'
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')[:1500]
                  reason='HTTP_ERROR'
                  try:
                      payload=json.loads(raw)
                      err=payload.get('error') or {}
                      details=err.get('details') or []
                      if details and isinstance(details[0],dict):
                          reason=str(details[0].get('reason') or err.get('status') or err.get('message') or reason)
                      else:
                          reason=str(err.get('status') or err.get('message') or reason)
                  except Exception:
                      pass
                  return e.code, reason[:180]
              except Exception as e:
                  return 0, type(e).__name__

          status,reason=probe(worker_key)
          rows=[
              f'API_KEY_PRESENT={"YES" if api_key else "NO"}',
              f'WORKER_KEY_PRESENT={"YES" if worker_key else "NO"}',
              f'API_KEY_FAMILY={family(api_key)}',
              f'WORKER_KEY_FAMILY={family(worker_key)}',
              f'API_KEY_LENGTH={len(api_key)}',
              f'WORKER_KEY_LENGTH={len(worker_key)}',
              f'API_KEY_FINGERPRINT={fp(api_key)}',
              f'WORKER_KEY_FINGERPRINT={fp(worker_key)}',
              f'API_WORKER_KEYS_MATCH={"YES" if api_key and api_key == worker_key else "NO"}',
              f'WORKER_KEY_FORMAT_CLEAN={"YES" if worker_key and worker_key == worker_key.strip() and not worker_key.startswith((chr(34), chr(39))) and not worker_key.endswith((chr(34), chr(39))) else "NO"}',
              f'CURRENT_WORKER_KEY_MODELS_HTTP={status}',
              f'CURRENT_WORKER_KEY_MODELS_REASON={reason}',
          ]
          for idx,row in enumerate(deployments[:3], start=1):
              rows.extend([
                  f'WORKER_DEPLOYMENT_{idx}_ID={row.get("id","")}',
                  f'WORKER_DEPLOYMENT_{idx}_STATUS={row.get("status","")}',
                  f'WORKER_DEPLOYMENT_{idx}_CREATED_AT={row.get("createdAt") or row.get("created_at") or ""}',
              ])
          Path('docs/runtime/gemini-current-key-diagnostic.txt').write_text('\n'.join(rows)+'\n')
          print('\n'.join(rows))
          PY
      - name: Record sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/gemini-current-key-diagnostic.txt
          git commit -m 'docs(dev): record current Gemini runtime diagnostic [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
