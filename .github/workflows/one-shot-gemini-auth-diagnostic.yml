name: One-shot Gemini auth diagnostic

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-gemini-auth-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: di-dev
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - run: npm install --global @railway/cli
      - name: Probe live Gemini authentication without exposing key
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service di-worker --json >/dev/null
          railway variable list --service di-worker --environment dev --json >/tmp/worker-vars.json
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          vars_=json.loads(Path('/tmp/worker-vars.json').read_text())
          key=str(vars_.get('DI_DOCAI_GEMINI_API_KEY') or '')
          model='gemini-3-flash-preview'
          base='https://generativelanguage.googleapis.com/v1beta'

          def call(url, *, header=False, body=None):
              headers={}
              if header:
                  headers['x-goog-api-key']=key
              if body is not None:
                  headers['Content-Type']='application/json'
              req=urllib.request.Request(url, data=body, headers=headers, method='POST' if body is not None else 'GET')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, 'OK'
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')[:1500]
                  reason='HTTP_ERROR'
                  try:
                      payload=json.loads(raw)
                      err=payload.get('error') or {}
                      reason=str((err.get('details') or [{}])[0].get('reason') or err.get('status') or err.get('message') or reason)
                  except Exception:
                      pass
                  return e.code, reason[:180]
              except Exception as e:
                  return 0, type(e).__name__

          if not key:
              rows=['GEMINI_KEY_PRESENT=NO']
          else:
              malformed = key != key.strip() or key.startswith(('"', "'")) or key.endswith(('"', "'"))
              rows=['GEMINI_KEY_PRESENT=YES', f'GEMINI_KEY_FORMAT_CLEAN={"NO" if malformed else "YES"}']
              body=json.dumps({'contents':[{'parts':[{'text':'Reply only with OK'}]}]}).encode()
              probes=[
                  ('HEADER_MODELS', f'{base}/models', True, None),
                  ('QUERY_MODELS', f'{base}/models?key={urllib.parse.quote(key, safe="")}', False, None),
                  ('HEADER_GENERATE', f'{base}/models/{model}:generateContent', True, body),
                  ('QUERY_GENERATE', f'{base}/models/{model}:generateContent?key={urllib.parse.quote(key, safe="")}', False, body),
              ]
              for name,url,header,payload in probes:
                  status,reason=call(url, header=header, body=payload)
                  rows.append(f'{name}_HTTP={status}')
                  rows.append(f'{name}_REASON={reason}')
          Path('docs/runtime/gemini-auth-diagnostic.txt').write_text('\n'.join(rows)+'\n')
          print('\n'.join(rows))
          PY
      - name: Record sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/gemini-auth-diagnostic.txt
          git commit -m 'docs(dev): record Gemini auth diagnostic [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
