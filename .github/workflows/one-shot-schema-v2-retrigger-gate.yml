name: One-shot Schema V2 retrigger gate

on:
  push:
    branches: [feature/schema-v2-document-extraction]
    paths:
      - '.github/workflows/one-shot-schema-v2-retrigger-gate.yml'

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/schema-v2-document-extraction
          fetch-depth: 0
      - name: Add 0014 migration to SQL gate trigger paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/one-shot-schema-v2-sandbox-sql-gate.yml')
          text=p.read_text()
          needle="      - 'backend/alembic/versions/0012_testbench_extraction_profiles.py'\n"
          add="      - 'backend/alembic/versions/0014_india_extraction_profiles_v1.py'\n"
          if add not in text:
              if needle not in text:
                  raise SystemExit('Gate trigger anchor not found')
              text=text.replace(needle,needle+add,1)
              p.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-schema-v2-sandbox-sql-gate.yml
          if git diff --cached --quiet; then
            echo 'Gate already includes 0014 path; touching comment to retrigger.'
            echo '# retrigger after 0014 canonical repair' >> .github/workflows/one-shot-schema-v2-sandbox-sql-gate.yml
            git add .github/workflows/one-shot-schema-v2-sandbox-sql-gate.yml
          fi
          git commit -m 'ci(schema-v2): rerun sandbox SQL gate after 0014 repair'
          git push origin HEAD:feature/schema-v2-document-extraction
