name: DI Railway DEV Deployment

on:
  push:
    branches: [dev]

permissions:
  actions: read
  contents: read

concurrency:
  group: di-railway-dev-deployment
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for DI CI (quality + smoke) to pass before Railway deploys
    runs-on: ubuntu-latest

    steps:
      - name: Wait for DI CI to pass on exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"

            ci_run="$(printf '%s' "$response" | jq -c '[.workflow_runs[] | select(.name == "DI CI")] | first // empty')"
            if [ -z "$ci_run" ]; then
              echo "DI CI not registered yet for $GITHUB_SHA; waiting 5 seconds."
              sleep 5
              continue
            fi

            status="$(printf '%s' "$ci_run" | jq -r '.status')"
            conclusion="$(printf '%s' "$ci_run" | jq -r '.conclusion // ""')"
            run_id="$(printf '%s' "$ci_run" | jq -r '.id')"
            echo "DI CI run $run_id status=$status conclusion=${conclusion:-pending}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "DI CI passed (quality + smoke) for $GITHUB_SHA — Railway GitHub integration will deploy."
                exit 0
              fi
              echo "::error::DI CI failed with conclusion '$conclusion'. Railway deployment should be cancelled."
              exit 1
            fi

            sleep 5
          done

          echo "::error::Timed out waiting for DI CI."
          exit 1

  # Deployment smoke proves the live service is healthy and fail-closed. Positive
  # Security authorization is tested separately in Increment J using an actual
  # Security-issued JWT; this workflow must not mint a parallel test-key identity.
  post-deploy-smoke:
    name: Post-Deploy Smoke
    runs-on: ubuntu-latest
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install project and dev tooling
        run: pip install -e ".[dev]"

      - name: Wait for Railway to deploy
        run: sleep 120

      - name: Run post-deploy smoke tests
        env:
          RAILWAY_API_URL: ${{ secrets.RAILWAY_API_URL }}
          SMOKE_TENANT_ID: post-deploy-smoke-tenant
        run: |
          if [ -z "${RAILWAY_API_URL}" ]; then
            echo "RAILWAY_API_URL not set — skipping post-deploy smoke"
            exit 0
          fi
          PYTHONPATH=src python -m pytest -m post_deploy_smoke --no-cov -q
