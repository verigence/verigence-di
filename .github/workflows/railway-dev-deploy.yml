name: DI Railway DEV Deployment

on:
  push:
    branches: [dev]

permissions:
  actions: read
  contents: read

concurrency:
  group: di-railway-dev-deployment
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for DI CI to pass before Railway deploys
    runs-on: ubuntu-latest

    steps:
      - name: Wait for DI CI to pass on exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"

            ci_run="$(printf '%s' "$response" | jq -c '[.workflow_runs[] | select(.name == "DI CI")] | first // empty')"
            if [ -z "$ci_run" ]; then
              echo "DI CI not registered yet for $GITHUB_SHA; waiting 5 seconds."
              sleep 5
              continue
            fi

            status="$(printf '%s' "$ci_run" | jq -r '.status')"
            conclusion="$(printf '%s' "$ci_run" | jq -r '.conclusion // ""')"
            run_id="$(printf '%s' "$ci_run" | jq -r '.id')"
            echo "DI CI run $run_id status=$status conclusion=${conclusion:-pending}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "DI CI passed for $GITHUB_SHA — Railway GitHub integration will deploy."
                exit 0
              fi
              echo "::error::DI CI failed with conclusion '$conclusion'. Railway deployment should be cancelled."
              exit 1
            fi

            sleep 5
          done

          echo "::error::Timed out waiting for DI CI."
          exit 1
