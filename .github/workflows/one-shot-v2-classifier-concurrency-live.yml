name: One-shot V2 classifier concurrency live

on:
  push:
    branches:
      - diagnose/v2-classifier-concurrency-live
    paths:
      - .github/workflows/one-shot-v2-classifier-concurrency-live.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      RAILWAY_ENVIRONMENT: dev
      DI_WORKER_SERVICE: di-worker
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnose/v2-classifier-concurrency-live

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify live classifier pool
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --json >/dev/null
          railway logs --service "$DI_WORKER_SERVICE" --latest --deployment --lines 300 >/tmp/worker.log
          grep -E 'capture_v2_classifier_pool_started|DI_CAPTURE_V2_CLASSIFIER_CONCURRENCY=' /tmp/worker.log || true
          grep -q 'DI_CAPTURE_V2_CLASSIFIER_CONCURRENCY=6' /tmp/worker.log || {
            echo '::error::Live DI worker does not report V2 classifier concurrency=6.'
            exit 1
          }
          echo 'V2_CLASSIFIER_CONCURRENCY_LIVE=PASS'
