name: CI — Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests (no-docker tests only)
        env:
          DI_SECRET_KEY: ${{ secrets.DI_SECRET_KEY }}
          DI_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DI_STORAGE_PROVIDER: minio
          DI_STORAGE_ENDPOINT: http://localhost:9000
          DI_STORAGE_ACCESS_KEY_ID: minioadmin
          DI_STORAGE_SECRET_ACCESS_KEY: minioadmin123
          DI_STORAGE_BUCKET: verigence-di-dev
          DI_DOCAI_MOCK: "true"
          DI_ENV: dev
        run: PYTHONPATH=src uv run python -m pytest -m "not docker" --no-cov -q

  deploy:
    name: Deploy to Railway dev
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy di-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service di-api --project ${{ secrets.RAILWAY_PROJECT_ID }} --detach

      - name: Deploy di-worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service di-worker --project ${{ secrets.RAILWAY_PROJECT_ID }} --detach
