name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Determine changed Python files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            find backend/src backend/tests backend/e2e -type f -name '*.py' | sed 's#^backend/##' | sort > /tmp/changed-python-files.txt
          else
            git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- backend/src backend/tests backend/e2e \
              | grep -E '^backend/(src|tests|e2e)/.*\.py$' \
              | sed 's#^backend/##' \
              | sort -u > /tmp/changed-python-files.txt || true
          fi

          echo 'Python files changed in this revision:'
          cat /tmp/changed-python-files.txt || true

      - name: Lint changed Python files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < /tmp/changed-python-files.txt
          if (( ${#files[@]} == 0 )); then
            echo 'No changed Python files to lint.'
            exit 0
          fi
          ruff check "${files[@]}"

      - name: Type check changed source files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep '^src/.*\.py$' /tmp/changed-python-files.txt || true)
          if (( ${#files[@]} == 0 )); then
            echo 'No changed source files to type check.'
            exit 0
          fi
          mypy "${files[@]}"

      - name: Compile live E2E harness
        run: python -m compileall -q e2e

      - name: Run tests
        env:
          DI_SECRET_KEY: "ci-test-secret-key-32-chars-minimum"
          DI_DOCAI_MOCK: "true"
          DI_STORAGE_PROVIDER: "minio"
          DI_STORAGE_ENDPOINT: "http://localhost:9000"
          DI_STORAGE_ACCESS_KEY_ID: "minioadmin"
          DI_STORAGE_SECRET_ACCESS_KEY: "minioadmin123"
          DI_STORAGE_BUCKET: "verigence-di-test"
          DI_CLERK_PUBLISHABLE_KEY: "pk_test_mock"
          DI_CLERK_SECRET_KEY: "sk_test_mock"
          DI_CLERK_JWKS_URL: "http://localhost/mock-jwks"
        run: pytest -q --maxfail=1 --tb=line

  frontend:
    name: Frontend — build check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Detect implemented operator UI
        id: ui
        shell: bash
        run: |
          if [[ -f ops-ui/package.json && -f ops-ui/package-lock.json ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'Operator UI is currently a placeholder; frontend build is not applicable.'
          fi

      - uses: actions/setup-node@v6
        if: steps.ui.outputs.exists == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ops-ui/package-lock.json

      - name: Install dependencies
        if: steps.ui.outputs.exists == 'true'
        working-directory: ops-ui
        run: npm ci

      - name: TypeScript build check
        if: steps.ui.outputs.exists == 'true'
        working-directory: ops-ui
        run: npm run build

  integration-preflight:
    name: DEV Security integration preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run DEV Security integration preflight
        env:
          DI_ENVIRONMENT: "dev"
          DI_SECURITY_BASE_URL: ${{ secrets.DI_SECURITY_BASE_URL_DEV }}
          DI_SECURITY_SERVICE_TOKEN: ${{ secrets.DI_SECURITY_SERVICE_TOKEN_DEV }}
          DI_SECURITY_API_KEY: ${{ secrets.DI_SECURITY_API_KEY_DEV }}
          DI_SECURITY_TIMEOUT_SECONDS: "15"
        run: python scripts/dev_security_integration_preflight.py

  deploy-dev:
    name: Deploy tested DI SHA to Railway DEV
    needs: [backend, frontend, integration-preflight]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        needs.backend.result == 'success' &&
        needs.frontend.result == 'success' &&
        needs.integration-preflight.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate deploy configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_DI_SERVICE_ID: ${{ secrets.RAILWAY_DI_SERVICE_ID }}
          RAILWAY_DI_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_DI_WORKER_SERVICE_ID }}
        run: |
          set -euo pipefail
          for name in \
            RAILWAY_TOKEN \
            RAILWAY_PROJECT_ID \
            RAILWAY_ENVIRONMENT_ID \
            RAILWAY_DI_SERVICE_ID \
            RAILWAY_DI_WORKER_SERVICE_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Deploy API service to Railway DEV
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ secrets.RAILWAY_DI_SERVICE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${RAILWAY_TOKEN}" \
            --data "$(jq -nc \
              --arg project "$PROJECT_ID" \
              --arg environment "$ENVIRONMENT_ID" \
              --arg service "$SERVICE_ID" \
              --arg sha "$DEPLOY_SHA" \
              '{query:"mutation serviceInstanceDeployV2($projectId: String!, $environmentId: String!, $serviceId: String!, $commitSha: String!) { serviceInstanceDeployV2(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId, commitSha: $commitSha) }",variables:{projectId:$project,environmentId:$environment,serviceId:$service,commitSha:$sha}}')"

      - name: Deploy worker service to Railway DEV
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ secrets.RAILWAY_DI_WORKER_SERVICE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${RAILWAY_TOKEN}" \
            --data "$(jq -nc \
              --arg project "$PROJECT_ID" \
              --arg environment "$ENVIRONMENT_ID" \
              --arg service "$SERVICE_ID" \
              --arg sha "$DEPLOY_SHA" \
              '{query:"mutation serviceInstanceDeployV2($projectId: String!, $environmentId: String!, $serviceId: String!, $commitSha: String!) { serviceInstanceDeployV2(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId, commitSha: $commitSha) }",variables:{projectId:$project,environmentId:$environment,serviceId:$service,commitSha:$sha}}')"
