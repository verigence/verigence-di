name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_extended:
        description: 'Run Tier 2 extended tests'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: di-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install project and dev tooling
        run: pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Import smoke check
        env:
          DI_SECRET_KEY: "ci-import-check-key-32-characters!!"
          DI_DATABASE_URL: "postgresql+asyncpg://user:pass@localhost/db"
          DI_DOCAI_MOCK: "true"
          DI_ENV: local
        run: PYTHONPATH=src python -c "from verigence.di.main import create_app; create_app()"

      - name: Ruff
        run: ruff check .

      - name: Determine changed source files
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            find backend/src -type f -name '*.py' | sed 's#^backend/##' | sort > /tmp/changed-source-files.txt
          else
            git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- backend/src \
              | grep -E '^backend/src/.*\.py$' \
              | sed 's#^backend/##' \
              | sort -u > /tmp/changed-source-files.txt || true
          fi

          echo 'Source files changed in this revision:'
          cat /tmp/changed-source-files.txt || true

      - name: Type check changed source files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < /tmp/changed-source-files.txt
          if (( ${#files[@]} == 0 )); then
            echo 'No changed source files to type check.'
            exit 0
          fi
          mypy "${files[@]}"

      - name: Run unit tests
        env:
          DI_SECRET_KEY: ${{ secrets.DI_SECRET_KEY }}
          DI_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DI_STORAGE_PROVIDER: minio
          DI_STORAGE_ENDPOINT: http://localhost:9000
          DI_STORAGE_ACCESS_KEY_ID: minioadmin
          DI_STORAGE_SECRET_ACCESS_KEY: minioadmin123
          DI_STORAGE_BUCKET: verigence-di-dev
          DI_DOCAI_MOCK: "true"
          DI_ENV: dev
        run: PYTHONPATH=src python -m pytest -m no_docker --no-cov -q

      - name: Verify installed dependency consistency
        run: python -m pip check

  smoke:
    name: Tier 1 Smoke Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install project and dev tooling
        run: pip install -e ".[dev]"

      - name: Run smoke tests
        env:
          DI_SECRET_KEY: ${{ secrets.DI_SECRET_KEY }}
          DI_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DI_ENV: dev
          DI_DOCAI_MOCK: "true"
          DI_WORKER_ENABLED: "false"
          DI_STORAGE_PROVIDER: r2
          DI_STORAGE_BUCKET: verigence-di-test
          DI_STORAGE_ENDPOINT: ${{ secrets.TEST_R2_ENDPOINT }}
          DI_STORAGE_ACCESS_KEY_ID: ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          DI_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          DI_STORAGE_REGION: auto
          DI_SECURITY_JWKS_URL: "https://raw.githubusercontent.com/${{ github.repository }}/dev/backend/tests/fixtures/test_jwks.json"
          TEST_JWT_PRIVATE_KEY: ${{ secrets.TEST_JWT_PRIVATE_KEY }}
        run: PYTHONPATH=src python -m pytest -m smoke --no-cov -q

  frontend:
    name: Frontend — build check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Detect implemented operator UI
        id: ui
        shell: bash
        run: |
          if [[ -f ops-ui/package.json && -f ops-ui/package-lock.json ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'Operator UI is currently a placeholder; frontend build is not applicable.'
          fi

      - uses: actions/setup-node@v6
        if: steps.ui.outputs.exists == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ops-ui/package-lock.json

      - name: Install dependencies
        if: steps.ui.outputs.exists == 'true'
        working-directory: ops-ui
        run: npm ci

      - name: TypeScript build check
        if: steps.ui.outputs.exists == 'true'
        working-directory: ops-ui
        run: npm run build

  extended:
    name: Tier 2 Extended Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_extended == 'true'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install project and dev tooling
        run: pip install -e ".[dev]"

      - name: Run extended tests
        env:
          DI_SECRET_KEY: ${{ secrets.DI_SECRET_KEY }}
          DI_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DI_ENV: dev
          DI_DOCAI_MOCK: "true"
          DI_WORKER_ENABLED: "false"
          DI_STORAGE_PROVIDER: r2
          DI_STORAGE_BUCKET: verigence-di-test
          DI_STORAGE_ENDPOINT: ${{ secrets.TEST_R2_ENDPOINT }}
          DI_STORAGE_ACCESS_KEY_ID: ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          DI_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          DI_STORAGE_REGION: auto
          DI_SECURITY_JWKS_URL: "https://raw.githubusercontent.com/${{ github.repository }}/dev/backend/tests/fixtures/test_jwks.json"
          TEST_JWT_PRIVATE_KEY: ${{ secrets.TEST_JWT_PRIVATE_KEY }}
        run: PYTHONPATH=src python -m pytest -m extended --no-cov -q
