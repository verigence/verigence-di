name: One-shot Schema V2 repair migration 0014

on:
  push:
    branches: [feature/schema-v2-document-extraction]
    paths:
      - '.github/workflows/one-shot-schema-v2-repair-0014.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/schema-v2-document-extraction
          fetch-depth: 0
      - name: Make 0014 respect deployed canonical vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/alembic/versions/0014_india_extraction_profiles_v1.py')
          text = p.read_text()
          old = '''    if existing is not None:\n        if existing != data_type:\n            raise RuntimeError(\n                f"Canonical field {field_key} already exists as {existing}, requested {data_type}"\n            )\n        return\n'''
          new = '''    if existing is not None:\n        # Existing canonical vocabulary is authoritative and immutable. 0014 is\n        # configuration-only, so reuse the deployed definition instead of\n        # rejecting a historical type difference.\n        return\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one strict canonical-type block, found {count}')
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- backend/alembic/versions/0014_india_extraction_profiles_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/alembic/versions/0014_india_extraction_profiles_v1.py
          git commit -m 'fix(di): make 0014 canonical bootstrap non-destructive'
          git push origin HEAD:feature/schema-v2-document-extraction
