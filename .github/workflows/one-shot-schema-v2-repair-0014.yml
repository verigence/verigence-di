name: One-shot Schema V2 repair migration 0014

on:
  push:
    branches: [feature/schema-v2-document-extraction]
    paths:
      - '.github/workflows/one-shot-schema-v2-repair-0014.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/schema-v2-document-extraction
          fetch-depth: 0
      - name: Normalize booking reference canonical declaration in 0014
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/alembic/versions/0014_india_extraction_profiles_v1.py')
          text = p.read_text()
          old = '("booking_reference_number", "Booking Reference Number", "IDENTIFIER", False, False, 0.0, 50, "Extract linked booking/order reference only when printed.", ["booking no", "order no"])'
          new = '("booking_reference_number", "Booking Reference Number", "STRING", False, False, 0.0, 50, "Extract linked booking/order reference only when printed.", ["booking no", "order no"])'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one delivery-order booking reference declaration, found {count}')
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- backend/alembic/versions/0014_india_extraction_profiles_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/alembic/versions/0014_india_extraction_profiles_v1.py
          git commit -m 'fix(di): normalize booking reference canonical type in 0014'
          git push origin HEAD:feature/schema-v2-document-extraction
