name: One-shot patch DI migration 0012 booking reference type

on:
  push:
    branches:
      - feature/schema-v2-document-extraction
    paths:
      - '.github/workflows/patch-0012-booking-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/schema-v2-document-extraction
          fetch-depth: 0
      - name: Patch migration 0012 only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/alembic/versions/0012_testbench_extraction_profiles.py')
          text = p.read_text()
          old = '("booking_reference_number", "Booking Reference Number", "IDENTIFIER", True, True, 1.0, 30, "Extract the booking, order, enquiry, or reference number.", ["booking no", "order no", "reference no"]),'
          new = '# The deployed canonical vocabulary already defines booking_reference_number as STRING.\n            # Reuse that immutable canonical type instead of trying to redefine it as IDENTIFIER.\n            ("booking_reference_number", "Booking Reference Number", "STRING", True, True, 1.0, 30, "Extract the booking, order, enquiry, or reference number.", ["booking no", "order no", "reference no"]),'
          if old not in text:
              raise SystemExit('Expected migration 0012 booking_reference_number definition not found exactly once')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target definition, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- backend/alembic/versions/0012_testbench_extraction_profiles.py
          git config user.name 'Verigence CI'
          git config user.email 'ci@verigence.local'
          git add backend/alembic/versions/0012_testbench_extraction_profiles.py
          git commit -m 'fix(di): preserve booking reference canonical type in 0012'
          git push origin HEAD:feature/schema-v2-document-extraction
