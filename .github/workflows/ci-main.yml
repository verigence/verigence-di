name: CI — Main (Production)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        env:
          DI_SECRET_KEY: ${{ secrets.DI_SECRET_KEY }}
          DI_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DI_STORAGE_PROVIDER: minio
          DI_STORAGE_ENDPOINT: http://localhost:9000
          DI_STORAGE_ACCESS_KEY_ID: minioadmin
          DI_STORAGE_SECRET_ACCESS_KEY: minioadmin123
          DI_STORAGE_BUCKET: verigence-di-dev
          DI_DOCAI_MOCK: "true"
          DI_ENV: dev
        run: PYTHONPATH=src uv run python -m pytest -m no_docker --no-cov -q

  deploy-api:
    name: Deploy di-api to Railway (production)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy di-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_API_ID }} --detach

  deploy-worker:
    name: Deploy di-worker to Railway (production)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy di-worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_WORKER_ID }} --detach
