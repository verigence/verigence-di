name: One-shot Schema V2 SQL gate

on:
  push:
    branches:
      - feature/schema-v2-document-extraction
    paths:
      - '.github/workflows/schema-v2-sql-gate.yml'
      - 'backend/scripts/schema_v2_sql_gate.py'

permissions:
  contents: read

jobs:
  gate:
    name: Schema V2 sandbox SQL gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SERVICE: di-api
      SANDBOX_HOST: ep-royal-pond-ayci3m0f.c-5.us-east-2.aws.neon.tech
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install one-shot clients
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          npm install --global @railway/cli

      - name: Run read-only gate using DI service credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || {
            echo '::error::RAILWAY_API_TOKEN is required for the SQL gate.'
            exit 1
          }
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$SERVICE" --json >/dev/null
          railway run --service "$SERVICE" --environment dev -- \
            python backend/scripts/schema_v2_sql_gate.py --sandbox-host "$SANDBOX_HOST"
