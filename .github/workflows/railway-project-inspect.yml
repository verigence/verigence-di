name: Inspect DI Railway project

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/railway-project-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: di-dev
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Inspect project and services
        shell: bash
        run: |
          set -euo pipefail
          railway status --json > /tmp/status.json
          railway service list --json > /tmp/services.json
          python - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('/tmp/status.json').read_text())
          services = json.loads(Path('/tmp/services.json').read_text())
          print(f"DI_RAILWAY_PROJECT_NAME={project.get('name')}")
          print(f"DI_RAILWAY_PROJECT_ID={project.get('id')}")
          for service in services:
              print(f"DI_SERVICE={service.get('name')}|{service.get('id')}")
          PY
