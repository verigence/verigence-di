name: One-shot Gemini secret source diagnostic

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-gemini-secret-source-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: di-dev
    env:
      CANDIDATE_DI_DOCAI: ${{ secrets.DI_DOCAI_GEMINI_API_KEY }}
      CANDIDATE_GEMINI: ${{ secrets.GEMINI_API_KEY }}
      CANDIDATE_GOOGLE: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - name: Probe candidate GitHub secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          candidates={
              'DI_DOCAI_GEMINI_API_KEY': os.getenv('CANDIDATE_DI_DOCAI',''),
              'GEMINI_API_KEY': os.getenv('CANDIDATE_GEMINI',''),
              'GOOGLE_API_KEY': os.getenv('CANDIDATE_GOOGLE',''),
          }
          rows=[]
          for name,key in candidates.items():
              rows.append(f'{name}_PRESENT={"YES" if key else "NO"}')
              if not key:
                  continue
              req=urllib.request.Request(
                  'https://generativelanguage.googleapis.com/v1beta/models',
                  headers={'x-goog-api-key': key},
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      status=response.status
                      reason='OK'
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  reason='HTTP_ERROR'
                  try:
                      payload=json.loads(exc.read().decode('utf-8','replace'))
                      err=payload.get('error') or {}
                      reason=str((err.get('details') or [{}])[0].get('reason') or err.get('status') or reason)
                  except Exception:
                      pass
              except Exception as exc:
                  status=0
                  reason=type(exc).__name__
              rows.append(f'{name}_HTTP={status}')
              rows.append(f'{name}_REASON={reason[:120]}')
          Path('docs/runtime/gemini-secret-source-diagnostic.txt').write_text('\n'.join(rows)+'\n')
          print('\n'.join(rows))
          PY
      - name: Record sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/gemini-secret-source-diagnostic.txt
          git commit -m 'docs(dev): record Gemini secret-source diagnostic [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
