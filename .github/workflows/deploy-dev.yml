name: Deploy DI DEV

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: di-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: di-dev
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      RAILWAY_ENVIRONMENT: dev
      DI_API_SERVICE: di-api
      DI_WORKER_SERVICE: di-worker
      DI_V2_WORKER_SERVICE: di-worker-v2
      DB_SERVICE: Postgres
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact tested DI revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Link and verify DI Railway DEV target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_API_TOKEN:-}" ]]; then
            echo '::error::RAILWAY_API_TOKEN is required for DI DEV deployment.'
            exit 1
          fi
          railway link --project "$PLATFORM_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --json >/tmp/link.json
          railway status --json >/tmp/status.json
          railway service list --json >/tmp/services.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          project=json.loads(Path('/tmp/status.json').read_text())
          services=json.loads(Path('/tmp/services.json').read_text())
          if project.get('id') != os.environ['PLATFORM_PROJECT_ID']:
              raise SystemExit('Railway API token does not target the approved shared DEV project')
          names={row.get('name') for row in services}
          required={os.environ['DI_API_SERVICE'], os.environ['DI_WORKER_SERVICE'], os.environ['DB_SERVICE']}
          missing=required-names
          if missing:
              raise SystemExit('DI Railway target is missing services: '+','.join(sorted(missing)))
          print('DI_RAILWAY_TARGET=PASS')
          print('DI_RAILWAY_ENVIRONMENT=dev')
          PY

      - name: Validate persisted DI configuration
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$DI_API_SERVICE" --json >/tmp/di-api-vars.json
          railway variable list --service "$DI_WORKER_SERVICE" --json >/tmp/di-worker-vars.json
          python - <<'PY'
          import json
          from pathlib import Path
          api=json.loads(Path('/tmp/di-api-vars.json').read_text())
          worker=json.loads(Path('/tmp/di-worker-vars.json').read_text())
          required=[
              'DI_SECRET_KEY', 'DI_STORAGE_PROVIDER', 'DI_STORAGE_BUCKET',
              'DI_STORAGE_ENDPOINT', 'DI_STORAGE_ACCESS_KEY_ID',
              'DI_STORAGE_SECRET_ACCESS_KEY', 'DI_DATABASE_URL',
              'DI_SECURITY_JWKS_URL',
          ]
          for service_name, data in [('di-api', api), ('di-worker', worker)]:
              missing=[key for key in required if not data.get(key)]
              if missing:
                  raise SystemExit(f'{service_name} missing persisted DI configuration: '+','.join(missing))
          shared=[
              'DI_SECRET_KEY','DI_STORAGE_PROVIDER','DI_STORAGE_BUCKET','DI_STORAGE_ENDPOINT',
              'DI_STORAGE_REGION','DI_STORAGE_ACCESS_KEY_ID','DI_STORAGE_SECRET_ACCESS_KEY',
              'DI_DOCAI_MOCK','DI_DOCAI_GEMINI_API_KEY','DI_DATABASE_URL','DI_SECURITY_JWKS_URL',
          ]
          drift=[key for key in shared if (api.get(key) or '') != (worker.get(key) or '')]
          if drift:
              raise SystemExit('DI API/worker configuration drift: '+','.join(drift))
          print('DI_PERSISTED_CONFIG=PASS')
          print('DI_CONFIG_PARITY=PASS')
          PY

      - name: Ensure dedicated V2 worker service and variables
        shell: bash
        run: |
          set -euo pipefail
          railway service list --json >/tmp/services-before-v2.json
          if ! SERVICE_FILE=/tmp/services-before-v2.json SERVICE_NAME="$DI_V2_WORKER_SERVICE" python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path(os.environ['SERVICE_FILE']).read_text())
          raise SystemExit(0 if any(row.get('name') == os.environ['SERVICE_NAME'] for row in rows) else 1)
          PY
          then
            railway add --service "$DI_V2_WORKER_SERVICE" --json >/tmp/di-v2-service-create.json
            echo "DI_V2_SERVICE=CREATED|$DI_V2_WORKER_SERVICE"
          else
            echo "DI_V2_SERVICE=EXISTS|$DI_V2_WORKER_SERVICE"
          fi

          # Keep the existing worker as the single legacy/V1 + EOD lane.
          railway variable set \
            --service "$DI_WORKER_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --skip-deploys \
            DI_WORKER_MODE=legacy >/dev/null

          # Copy DI runtime configuration without printing secret values. Worker-specific
          # topology keys are set explicitly below.
          railway variable list --service "$DI_WORKER_SERVICE" --json >/tmp/di-worker-vars-copy.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          source=json.loads(Path('/tmp/di-worker-vars-copy.json').read_text())
          excluded={
              'DI_WORKER_MODE',
              'DI_V2_CLASSIFICATION_CONCURRENCY',
              'DI_V2_EXTRACTION_CONCURRENCY',
          }
          assignments=[
              f'{key}={value}'
              for key, value in source.items()
              if key.startswith('DI_') and key not in excluded and value is not None
          ]
          cmd=[
              'railway','variable','set',
              '--service',os.environ['DI_V2_WORKER_SERVICE'],
              '--environment',os.environ['RAILWAY_ENVIRONMENT'],
              '--skip-deploys',
              *assignments,
              'DI_WORKER_MODE=v2',
              'DI_V2_CLASSIFICATION_CONCURRENCY=4',
              'DI_V2_EXTRACTION_CONCURRENCY=4',
          ]
          subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL)
          print('DI_V2_VARIABLE_COPY=PASS')
          PY

          railway variable list --service "$DI_V2_WORKER_SERVICE" --json >/tmp/di-v2-worker-vars.json
          python - <<'PY'
          import json
          from pathlib import Path
          legacy=json.loads(Path('/tmp/di-worker-vars-copy.json').read_text())
          v2=json.loads(Path('/tmp/di-v2-worker-vars.json').read_text())
          required=[
              'DI_SECRET_KEY','DI_STORAGE_PROVIDER','DI_STORAGE_BUCKET','DI_STORAGE_ENDPOINT',
              'DI_STORAGE_ACCESS_KEY_ID','DI_STORAGE_SECRET_ACCESS_KEY','DI_DATABASE_URL',
              'DI_SECURITY_JWKS_URL','DI_WORKER_NOTIFY_DB_URL',
          ]
          missing=[key for key in required if not v2.get(key)]
          if missing:
              raise SystemExit('di-worker-v2 missing persisted DI configuration: '+','.join(missing))
          shared=[
              'DI_SECRET_KEY','DI_STORAGE_PROVIDER','DI_STORAGE_BUCKET','DI_STORAGE_ENDPOINT',
              'DI_STORAGE_REGION','DI_STORAGE_ACCESS_KEY_ID','DI_STORAGE_SECRET_ACCESS_KEY',
              'DI_DOCAI_MOCK','DI_DOCAI_GEMINI_API_KEY','DI_DATABASE_URL','DI_SECURITY_JWKS_URL',
              'DI_WORKER_NOTIFY_DB_URL',
          ]
          drift=[key for key in shared if (legacy.get(key) or '') != (v2.get(key) or '')]
          if drift:
              raise SystemExit('legacy/V2 worker configuration drift: '+','.join(drift))
          if v2.get('DI_WORKER_MODE') != 'v2':
              raise SystemExit('di-worker-v2 must run with DI_WORKER_MODE=v2')
          if v2.get('DI_V2_CLASSIFICATION_CONCURRENCY') != '4':
              raise SystemExit('di-worker-v2 classification concurrency must be 4')
          if v2.get('DI_V2_EXTRACTION_CONCURRENCY') != '4':
              raise SystemExit('di-worker-v2 extraction concurrency must be 4')
          print('DI_V2_PERSISTED_CONFIG=PASS')
          print('DI_LEGACY_V2_CONFIG_PARITY=PASS')
          PY

      - name: Prepare DI Railway configs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/di-api-railway.toml <<'TOML'
          [build]
          builder = "DOCKERFILE"
          dockerfilePath = "Dockerfile"

          [deploy]
          preDeployCommand = ["alembic upgrade head"]
          startCommand = "sh -c 'uvicorn verigence.di.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8000}'"
          healthcheckPath = "/health"
          healthcheckTimeout = 100
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 3
          TOML
          cat > /tmp/di-worker-railway.toml <<'TOML'
          [build]
          builder = "DOCKERFILE"
          dockerfilePath = "Dockerfile.worker"

          [deploy]
          startCommand = "python -m verigence.di.workers"
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 10
          TOML

      - name: Record current DI deployments
        shell: bash
        run: |
          set -euo pipefail
          for service in "$DI_API_SERVICE" "$DI_WORKER_SERVICE" "$DI_V2_WORKER_SERVICE"; do
            railway deployment list --service "$service" --limit 1 --json >"/tmp/${service}-before.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          for service in (
              os.environ['DI_API_SERVICE'],
              os.environ['DI_WORKER_SERVICE'],
              os.environ['DI_V2_WORKER_SERVICE'],
          ):
              rows=json.loads(Path(f'/tmp/{service}-before.json').read_text())
              previous=rows[0].get('id','') if rows else ''
              print(f'DI_PREVIOUS_DEPLOYMENT|{service}|{previous or "NONE"}')
          PY

      - name: Deploy DI API
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/di-api-railway.toml backend/railway.toml
          railway up backend --path-as-root --service "$DI_API_SERVICE" --detach --yes \
            --message "DI API DEV ${DEPLOY_SHA}" >/dev/null

      - name: Deploy legacy DI worker
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/di-worker-railway.toml backend/railway.toml
          railway up backend --path-as-root --service "$DI_WORKER_SERVICE" --detach --yes \
            --message "DI legacy worker DEV ${DEPLOY_SHA}" >/dev/null

      - name: Deploy dedicated V2 DI worker
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/di-worker-railway.toml backend/railway.toml
          railway up backend --path-as-root --service "$DI_V2_WORKER_SERVICE" --detach --yes \
            --message "DI V2 worker DEV ${DEPLOY_SHA}" >/dev/null

      - name: Verify fresh DI deployments and worker topology
        shell: bash
        run: |
          set -euo pipefail
          for service in "$DI_API_SERVICE" "$DI_WORKER_SERVICE" "$DI_V2_WORKER_SERVICE"; do
            previous_id="$(SERVICE_FILE="/tmp/${service}-before.json" python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path(os.environ['SERVICE_FILE']).read_text())
          print(rows[0].get('id','') if rows else '')
          PY
          )"
            for attempt in $(seq 1 30); do
              railway deployment list --service "$service" --limit 1 --json >"/tmp/${service}-deployment.json"
              read -r deployment_id status <<<"$(SERVICE_FILE="/tmp/${service}-deployment.json" python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path(os.environ['SERVICE_FILE']).read_text())
          if rows:
              print(rows[0].get('id',''), rows[0].get('status',''))
          else:
              print(' ')
          PY
          )"
              if [[ -z "$deployment_id" || "$deployment_id" == "$previous_id" ]]; then
                echo "Waiting for fresh $service deployment (attempt $attempt/30)"
                sleep 10
                continue
              fi
              case "$status" in
                SUCCESS)
                  echo "DI_DEPLOYMENT=PASS|$service|$deployment_id"
                  break
                  ;;
                FAILED|CRASHED|REMOVED)
                  railway logs --service "$service" --latest --deployment --lines 240 || true
                  echo "$service deployment failed: $status" >&2
                  exit 1
                  ;;
              esac
              if [[ "$attempt" == "30" ]]; then
                railway logs --service "$service" --latest --deployment --lines 240 || true
                echo "$service fresh deployment did not reach SUCCESS: $status" >&2
                exit 1
              fi
              sleep 10
            done
          done

          wait_for_worker_marker() {
            local service="$1"
            local logfile="$2"
            local marker="$3"
            local lines="$4"
            for attempt in $(seq 1 20); do
              railway logs --service "$service" --latest --deployment --lines "$lines" >"$logfile" || true
              if grep -q "$marker" "$logfile"; then
                echo "DI_WORKER_LOG_READY=PASS|$service|attempt=$attempt"
                return 0
              fi
              echo "Waiting for $service startup markers (attempt $attempt/20)"
              sleep 3
            done
            tail -n 220 "$logfile" >&2 || true
            echo "::error::$service deployment reached SUCCESS but startup markers did not become visible." >&2
            return 1
          }

          wait_for_worker_marker "$DI_WORKER_SERVICE" /tmp/di-worker.log 'DI_EOD_SCHEDULER_STARTED=PASS' 320
          grep -q 'DI_WORKER_MODE=legacy' /tmp/di-worker.log || { tail -n 200 /tmp/di-worker.log >&2; exit 1; }
          grep -q 'DI_LEGACY_PROCESSING_STARTED=PASS' /tmp/di-worker.log || { tail -n 200 /tmp/di-worker.log >&2; exit 1; }
          grep -q 'DI_EOD_SCHEDULER_STARTED=PASS' /tmp/di-worker.log || { tail -n 200 /tmp/di-worker.log >&2; exit 1; }
          if grep -q 'DI_V2_WORKER_STARTED=PASS' /tmp/di-worker.log; then
            echo '::error::Legacy di-worker unexpectedly started V2 pools.'
            exit 1
          fi
          echo 'DI_LEGACY_WORKER=PASS'
          echo 'DI_EOD_SCHEDULER=PASS'

          wait_for_worker_marker "$DI_V2_WORKER_SERVICE" /tmp/di-v2-worker.log 'DI_V2_EXTRACTION_CONCURRENCY=4' 360
          grep -q 'DI_WORKER_MODE=v2' /tmp/di-v2-worker.log || { tail -n 220 /tmp/di-v2-worker.log >&2; exit 1; }
          grep -q 'DI_V2_WORKER_STARTED=PASS' /tmp/di-v2-worker.log || { tail -n 220 /tmp/di-v2-worker.log >&2; exit 1; }
          grep -q 'DI_CAPTURE_V2_CLASSIFIER_CONCURRENCY=4' /tmp/di-v2-worker.log || { tail -n 220 /tmp/di-v2-worker.log >&2; exit 1; }
          grep -q 'DI_V2_EXTRACTION_CONCURRENCY=4' /tmp/di-v2-worker.log || { tail -n 220 /tmp/di-v2-worker.log >&2; exit 1; }
          if grep -q 'DI_EOD_SCHEDULER_STARTED=PASS' /tmp/di-v2-worker.log; then
            echo '::error::Dedicated V2 worker unexpectedly started the EOD scheduler.'
            exit 1
          fi
          echo 'DI_V2_WORKER_TOPOLOGY=PASS'

      - name: Scale dedicated V2 worker to two replicas
        shell: bash
        run: |
          set -euo pipefail
          region="$(grep 'DI_WORKER_REPLICA_REGION=' /tmp/di-v2-worker.log | tail -n 1 | sed 's/.*DI_WORKER_REPLICA_REGION=//' | tr -d '\r' | xargs)"
          if [[ -z "$region" || "$region" == "unknown" ]]; then
            echo '::error::Could not resolve the Railway region of di-worker-v2; refusing to guess a region.'
            tail -n 220 /tmp/di-v2-worker.log >&2
            exit 1
          fi
          railway scale \
            --service "$DI_V2_WORKER_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --json \
            "${region}=2" >/tmp/di-v2-scale.json
          echo "DI_V2_REPLICA_SCALE=PASS|region=$region|replicas=2"

      - name: Resolve or create DI API public domain
        shell: bash
        run: |
          set -euo pipefail
          resolve_domain() {
            railway variable list --service "$DI_API_SERVICE" --json >/tmp/di-api-vars.json
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/di-api-vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          }

          domain="$(resolve_domain)"
          if [[ -z "$domain" ]]; then
            echo 'DI_PUBLIC_DOMAIN=CREATE'
            railway domain \
              --project "$PLATFORM_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --service "$DI_API_SERVICE" \
              --json >/tmp/di-domain-create.json
            for attempt in $(seq 1 20); do
              domain="$(resolve_domain)"
              if [[ -n "$domain" ]]; then
                break
              fi
              echo "Waiting for DI public domain to become available (attempt $attempt/20)"
              sleep 3
            done
          fi

          [[ -n "$domain" ]] || {
            cat /tmp/di-domain-create.json 2>/dev/null || true
            echo '::error::DI Railway DEV API public domain could not be resolved or created.'
            exit 1
          }
          case "$domain" in
            http://*|https://*) base="${domain%/}" ;;
            *) base="https://${domain%/}" ;;
          esac
          echo "DI_PUBLIC_BASE=$base" >> "$GITHUB_ENV"
          echo "DI_PUBLIC_DOMAIN=PASS|$base"

      - name: Smoke test DI health and readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            health="$(curl --silent --show-error --output /tmp/di-health.json --write-out '%{http_code}' "$DI_PUBLIC_BASE/health" || true)"
            ready="$(curl --silent --show-error --output /tmp/di-ready.json --write-out '%{http_code}' "$DI_PUBLIC_BASE/ready" || true)"
            if [[ "$health" == "200" && "$ready" == "200" ]]; then
              echo 'DI_PUBLIC_HEALTH=PASS'
              echo 'DI_PUBLIC_READY=PASS'
              echo "DI_DEPLOYED_SHA=${DEPLOY_SHA}"
              exit 0
            fi
            echo "Waiting for DI public smoke readiness: health=$health ready=$ready (attempt $attempt/20)"
            sleep 3
          done
          echo '::error::DI public /health or /ready did not reach HTTP 200.'
          exit 1
