name: Deploy DI DEV

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: di-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: di-dev
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_TOKEN_DEV }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      RAILWAY_ENVIRONMENT: dev
      DI_API_SERVICE: di-api
      DI_WORKER_SERVICE: di-worker
      DB_SERVICE: Postgres
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out exact tested DI revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Link and verify DI Railway DEV target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo '::error::RAILWAY_TOKEN or RAILWAY_TOKEN_DEV is required.'
            exit 1
          fi
          railway link --project "$PLATFORM_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --json >/tmp/link.json
          railway status --json >/tmp/status.json
          railway service list --json >/tmp/services.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          project=json.loads(Path('/tmp/status.json').read_text())
          services=json.loads(Path('/tmp/services.json').read_text())
          if project.get('id') != os.environ['PLATFORM_PROJECT_ID']:
              raise SystemExit('Railway token does not target the approved shared DEV project')
          names={row.get('name') for row in services}
          required={os.environ['DI_API_SERVICE'], os.environ['DI_WORKER_SERVICE'], os.environ['DB_SERVICE']}
          missing=required-names
          if missing:
              raise SystemExit('DI Railway target is missing services: '+','.join(sorted(missing)))
          print('DI_RAILWAY_TARGET=PASS')
          print('DI_RAILWAY_ENVIRONMENT=dev')
          PY

      - name: Validate persisted DI configuration
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$DI_API_SERVICE" --json >/tmp/di-api-vars.json
          railway variable list --service "$DI_WORKER_SERVICE" --json >/tmp/di-worker-vars.json
          python - <<'PY'
          import json
          from pathlib import Path
          api=json.loads(Path('/tmp/di-api-vars.json').read_text())
          worker=json.loads(Path('/tmp/di-worker-vars.json').read_text())
          required=[
              'DI_SECRET_KEY', 'DI_STORAGE_PROVIDER', 'DI_STORAGE_BUCKET',
              'DI_STORAGE_ENDPOINT', 'DI_STORAGE_ACCESS_KEY_ID',
              'DI_STORAGE_SECRET_ACCESS_KEY', 'DI_DATABASE_URL',
              'DI_SECURITY_JWKS_URL',
          ]
          for service_name, data in [('di-api', api), ('di-worker', worker)]:
              missing=[key for key in required if not data.get(key)]
              if missing:
                  raise SystemExit(f'{service_name} missing persisted DI configuration: '+','.join(missing))
          shared=[
              'DI_SECRET_KEY','DI_STORAGE_PROVIDER','DI_STORAGE_BUCKET','DI_STORAGE_ENDPOINT',
              'DI_STORAGE_REGION','DI_STORAGE_ACCESS_KEY_ID','DI_STORAGE_SECRET_ACCESS_KEY',
              'DI_DOCAI_MOCK','DI_DOCAI_GEMINI_API_KEY','DI_DATABASE_URL','DI_SECURITY_JWKS_URL',
          ]
          drift=[key for key in shared if (api.get(key) or '') != (worker.get(key) or '')]
          if drift:
              raise SystemExit('DI API/worker configuration drift: '+','.join(drift))
          print('DI_PERSISTED_CONFIG=PASS')
          print('DI_CONFIG_PARITY=PASS')
          PY

      - name: Prepare DI Railway configs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/di-api-railway.toml <<'TOML'
          [build]
          builder = "DOCKERFILE"
          dockerfilePath = "Dockerfile"

          [deploy]
          preDeployCommand = ["alembic upgrade head"]
          startCommand = "sh -c 'uvicorn verigence.di.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8000}'"
          healthcheckPath = "/health"
          healthcheckTimeout = 100
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 3
          TOML
          cat > /tmp/di-worker-railway.toml <<'TOML'
          [build]
          builder = "DOCKERFILE"
          dockerfilePath = "Dockerfile.worker"

          [deploy]
          startCommand = "python -m verigence.di.workers"
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 10
          TOML

      - name: Record current DI deployments
        shell: bash
        run: |
          set -euo pipefail
          for service in "$DI_API_SERVICE" "$DI_WORKER_SERVICE"; do
            railway deployment list --service "$service" --limit 1 --json >"/tmp/${service}-before.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          for service in (os.environ['DI_API_SERVICE'], os.environ['DI_WORKER_SERVICE']):
              rows=json.loads(Path(f'/tmp/{service}-before.json').read_text())
              previous=rows[0].get('id','') if rows else ''
              print(f'DI_PREVIOUS_DEPLOYMENT|{service}|{previous or "NONE"}')
          PY

      - name: Deploy DI API
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/di-api-railway.toml backend/railway.toml
          railway up backend --path-as-root --service "$DI_API_SERVICE" --detach --yes \
            --message "DI API DEV ${DEPLOY_SHA}" >/dev/null

      - name: Deploy DI worker
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/di-worker-railway.toml backend/railway.toml
          railway up backend --path-as-root --service "$DI_WORKER_SERVICE" --detach --yes \
            --message "DI worker DEV ${DEPLOY_SHA}" >/dev/null

      - name: Verify fresh DI deployments and worker topology
        shell: bash
        run: |
          set -euo pipefail
          for service in "$DI_API_SERVICE" "$DI_WORKER_SERVICE"; do
            previous_id="$(SERVICE_FILE="/tmp/${service}-before.json" python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path(os.environ['SERVICE_FILE']).read_text())
          print(rows[0].get('id','') if rows else '')
          PY
          )"
            for attempt in $(seq 1 30); do
              railway deployment list --service "$service" --limit 1 --json >"/tmp/${service}-deployment.json"
              read -r deployment_id status <<<"$(SERVICE_FILE="/tmp/${service}-deployment.json" python - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads(Path(os.environ['SERVICE_FILE']).read_text())
          if rows:
              print(rows[0].get('id',''), rows[0].get('status',''))
          else:
              print(' ')
          PY
          )"
              if [[ -z "$deployment_id" || "$deployment_id" == "$previous_id" ]]; then
                echo "Waiting for fresh $service deployment (attempt $attempt/30)"
                sleep 10
                continue
              fi
              case "$status" in
                SUCCESS)
                  echo "DI_DEPLOYMENT=PASS|$service|$deployment_id"
                  break
                  ;;
                FAILED|CRASHED|REMOVED)
                  railway logs --service "$service" --latest --deployment --lines 240 || true
                  echo "$service deployment failed: $status" >&2
                  exit 1
                  ;;
              esac
              if [[ "$attempt" == "30" ]]; then
                railway logs --service "$service" --latest --deployment --lines 240 || true
                echo "$service fresh deployment did not reach SUCCESS: $status" >&2
                exit 1
              fi
              sleep 10
            done
          done
          railway logs --service "$DI_WORKER_SERVICE" --latest --deployment --lines 260 >/tmp/di-worker.log
          grep -q 'DI_WORKER_STARTED=PASS' /tmp/di-worker.log || { tail -n 180 /tmp/di-worker.log >&2; exit 1; }
          grep -q 'DI_EOD_SCHEDULER_STARTED=PASS' /tmp/di-worker.log || { tail -n 180 /tmp/di-worker.log >&2; exit 1; }
          echo 'DI_WORKER=PASS'
          echo 'DI_EOD_SCHEDULER=PASS'

      - name: Smoke test DI health and readiness
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$DI_API_SERVICE" --json >/tmp/di-api-vars.json
          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/di-api-vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          if [[ -z "$domain" ]]; then
            echo '::error::DI Railway DEV API has no public domain configured.'
            exit 1
          fi
          case "$domain" in
            http://*|https://*) base="${domain%/}" ;;
            *) base="https://${domain%/}" ;;
          esac
          curl --fail --silent --show-error "$base/health" >/tmp/di-health.json
          curl --fail --silent --show-error "$base/ready" >/tmp/di-ready.json
          echo 'DI_PUBLIC_HEALTH=PASS'
          echo 'DI_PUBLIC_READY=PASS'
          echo "DI_DEPLOYED_SHA=${DEPLOY_SHA}"
