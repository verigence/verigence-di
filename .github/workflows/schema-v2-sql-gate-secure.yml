name: One-shot Schema V2 secure DB diagnostic

# One-shot diagnostic: ciphertext must be generated for this exact run.
on:
  push:
    branches:
      - feature/schema-v2-document-extraction
    paths:
      - '.github/workflows/schema-v2-sql-gate-secure.yml'

permissions:
  contents: read

jobs:
  keygen:
    name: Generate ephemeral DB-diagnostic key
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Generate and protect ephemeral transport key
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || exit 1
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/schema-v2-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/schema-v2-private.pem -pubout -out /tmp/schema-v2-public.pem
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/schema-v2-private.pem \
            -out /tmp/schema-v2-private.enc \
            -pass env:RAILWAY_API_TOKEN
          rm -f /tmp/schema-v2-private.pem
          echo 'SCHEMA_V2_GATE_PUBLIC_KEY_BEGIN'
          base64 -w0 /tmp/schema-v2-public.pem
          echo
          echo 'SCHEMA_V2_GATE_PUBLIC_KEY_END'
          rm -f /tmp/schema-v2-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: schema-v2-encrypted-private-key
          path: /tmp/schema-v2-private.enc
          retention-days: 1
          if-no-files-found: error

  diagnostic:
    name: Read-only Schema V2 sandbox diagnostic
    needs: keygen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SANDBOX_HOST: ep-royal-pond-ayci3m0f.c-5.us-east-2.aws.neon.tech
      CIPHERTEXT_PATH: backend/scripts/.schema_v2_gate_ciphertext.b64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install SQL client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - uses: actions/download-artifact@v4
        with:
          name: schema-v2-encrypted-private-key
          path: /tmp/schema-v2-key
      - name: Recover ephemeral private key in runner memory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/schema-v2-key/schema-v2-private.enc \
            -out /tmp/schema-v2-private.pem \
            -pass env:RAILWAY_API_TOKEN
          rm -f /tmp/schema-v2-key/schema-v2-private.enc
      - name: Wait for encrypted sandbox credential and run read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 90); do
            git fetch --quiet origin feature/schema-v2-document-extraction
            if git show FETCH_HEAD:"$CIPHERTEXT_PATH" >/tmp/schema-v2-cipher.b64 2>/dev/null; then
              found=1
              echo "ENCRYPTED_CREDENTIAL=RECEIVED attempt=$attempt"
              break
            fi
            sleep 5
          done
          [ "$found" = "1" ] || exit 1
          base64 -d /tmp/schema-v2-cipher.b64 >/tmp/schema-v2-cipher.bin
          openssl pkeyutl -decrypt \
            -inkey /tmp/schema-v2-private.pem \
            -in /tmp/schema-v2-cipher.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/schema-v2-db-url
          export DI_DATABASE_URL="$(cat /tmp/schema-v2-db-url)"
          python backend/scripts/schema_v2_db_diagnostic.py --expected-host "$SANDBOX_HOST"
          unset DI_DATABASE_URL
          rm -f /tmp/schema-v2-db-url /tmp/schema-v2-cipher.bin /tmp/schema-v2-cipher.b64 /tmp/schema-v2-private.pem
