name: One-shot DI worker runtime diagnostic

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-di-worker-runtime-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - run: npm install --global @railway/cli

      - name: Inspect non-secret worker configuration
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service di-worker --json >/dev/null
          railway variable list --service di-worker --environment dev --json >/tmp/worker-vars.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/worker-vars.json').read_text())
          def present(k): return 'SET' if str(v.get(k) or '').strip() else 'MISSING'
          lines=[
            'DI_WORKER_RUNTIME_DIAGNOSTIC',
            'DI_ENV='+str(v.get('DI_ENV') or ''),
            'DI_DOCAI_MOCK='+str(v.get('DI_DOCAI_MOCK') or 'UNSET'),
            'DI_DOCAI_GEMINI_API_KEY='+present('DI_DOCAI_GEMINI_API_KEY'),
            'DI_DATABASE_URL='+present('DI_DATABASE_URL'),
            'DI_WORKER_ENABLED='+str(v.get('DI_WORKER_ENABLED') or 'UNSET'),
          ]
          Path('docs/runtime/di-worker-runtime-diagnostic.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Inspect Railway Postgres Aadhaar processing metadata
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service Postgres --environment dev --json >/tmp/postgres-vars.json
          python -m pip install --quiet 'psycopg[binary]>=3.2,<4'
          python - <<'PY'
          import json
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row

          vars_=json.loads(Path('/tmp/postgres-vars.json').read_text())
          db_url=str(vars_.get('DATABASE_PUBLIC_URL') or vars_.get('DATABASE_URL') or '').strip()
          out=Path('docs/runtime/di-worker-runtime-diagnostic.txt')
          if not db_url:
              with out.open('a') as f:
                  f.write('RAILWAY_DB_DIAGNOSTIC=NO_DATABASE_URL\n')
              raise SystemExit(0)

          def safe(value):
              if value is None:
                  return 'NULL'
              return str(value).replace('\n',' ')[:240]

          with psycopg.connect(db_url, autocommit=True, connect_timeout=20, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  lines=['RAILWAY_DB_DIAGNOSTIC=BEGIN']
                  try:
                      cur.execute('SELECT version_num FROM docintel.alembic_version')
                      versions=[r['version_num'] for r in cur.fetchall()]
                      lines.append('DI_ALEMBIC_VERSION='+','.join(map(str, versions)))
                  except Exception as exc:
                      lines.append('DI_ALEMBIC_VERSION_ERROR='+safe(exc))

                  cur.execute("""
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema='docintel' AND table_name='documents'
                        AND column_name IN (
                          'audit_requirement_ref','audit_storage_context_id',
                          'document_type_hint_key','current_processing_run_id'
                        )
                      ORDER BY column_name
                  """)
                  lines.append('DOCUMENT_COLUMNS='+','.join(r['column_name'] for r in cur.fetchall()))

                  cur.execute("""
                      SELECT d.tenant_id,
                             d.document_id,
                             d.document_type_hint_key,
                             dt.document_type_key,
                             d.upload_status,
                             d.processing_status,
                             d.processing_failure_code,
                             d.current_processing_run_id,
                             d.registered_at_utc
                      FROM docintel.documents d
                      LEFT JOIN docintel.document_types dt
                        ON dt.document_type_id=d.document_type_id
                      WHERE lower(COALESCE(d.document_type_hint_key,''))='aadhaar'
                         OR lower(COALESCE(dt.document_type_key,''))='aadhaar'
                      ORDER BY d.registered_at_utc DESC
                      LIMIT 10
                  """)
                  docs=cur.fetchall()
                  lines.append('AADHAAR_DOCUMENT_COUNT='+str(len(docs)))

                  for index, doc in enumerate(docs, start=1):
                      tid=doc['tenant_id']
                      did=doc['document_id']
                      current=doc['current_processing_run_id']
                      lines.append(
                          'AADHAAR_DOC|%d|tenant=%s|document=%s|hint=%s|classified=%s|upload=%s|processing=%s|failure=%s|current_run=%s|registered=%s'
                          % (
                              index, safe(tid), safe(did), safe(doc['document_type_hint_key']),
                              safe(doc['document_type_key']), safe(doc['upload_status']),
                              safe(doc['processing_status']), safe(doc['processing_failure_code']),
                              safe(current), safe(doc['registered_at_utc'])
                          )
                      )
                      cur.execute("""
                          SELECT processing_run_id, run_status, extraction_profile_id,
                                 error_code, started_at_utc
                          FROM docintel.processing_runs
                          WHERE tenant_id=%s AND document_id=%s
                          ORDER BY started_at_utc DESC
                          LIMIT 5
                      """, (tid, did))
                      runs=cur.fetchall()
                      lines.append('RUN_COUNT|document=%s|count=%d' % (safe(did), len(runs)))
                      for run in runs:
                          rid=run['processing_run_id']
                          cur.execute("""
                              SELECT count(*) AS fact_count
                              FROM docintel.extracted_facts
                              WHERE tenant_id=%s AND document_id=%s AND processing_run_id=%s
                          """, (tid, did, rid))
                          fact_count=cur.fetchone()['fact_count']
                          lines.append(
                              'RUN|document=%s|run=%s|status=%s|profile=%s|error=%s|facts=%s|started=%s|is_current=%s'
                              % (
                                  safe(did), safe(rid), safe(run['run_status']),
                                  safe(run['extraction_profile_id']), safe(run['error_code']),
                                  safe(fact_count), safe(run['started_at_utc']), str(rid == current)
                              )
                          )

                      cur.execute("""
                          SELECT ef.processing_run_id, cf.field_key, ef.found_status,
                                 ef.confidence_score
                          FROM docintel.extracted_facts ef
                          JOIN docintel.canonical_fields cf
                            ON cf.canonical_field_id=ef.canonical_field_id
                          WHERE ef.tenant_id=%s AND ef.document_id=%s
                          ORDER BY ef.created_at_utc, cf.field_key
                          LIMIT 40
                      """, (tid, did))
                      facts=cur.fetchall()
                      keys=[]
                      for fact in facts:
                          keys.append('%s:%s@%s' % (
                              safe(fact['field_key']), safe(fact['found_status']), safe(fact['processing_run_id'])
                          ))
                      lines.append('FACT_KEYS|document=%s|%s' % (safe(did), ','.join(keys)))

                  lines.append('RAILWAY_DB_DIAGNOSTIC=END')
                  with out.open('a',encoding='utf-8') as f:
                      f.write('\n'.join(lines)+'\n')
                  print('\n'.join(lines))
          PY

      - name: Collect recent extraction lifecycle logs
        shell: bash
        run: |
          set +e
          railway logs --service di-worker --environment dev -n 1800 >/tmp/worker.log 2>/tmp/log.err
          rc=$?
          python - <<'PY'
          import re
          from pathlib import Path
          raw=Path('/tmp/worker.log').read_text(errors='replace') if Path('/tmp/worker.log').exists() else ''
          selected=[]
          keywords=(
              'processing_run_', 'extraction_request', 'extraction_result',
              'classification_result', 'classification_failed', 'provider_error',
              'worker_internal_error', 'processing_job_failed', 'gemini'
          )
          for line in raw.splitlines():
              low=line.lower()
              if any(k in low for k in keywords):
                  line=re.sub(r'AIza[0-9A-Za-z_-]{20,}', '[REDACTED_GOOGLE_KEY]', line)
                  line=re.sub(r'(?i)(bearer\s+)[A-Za-z0-9._~+/-]+=*', r'\1[REDACTED]', line)
                  line=re.sub(r'(?i)(api[_-]?key["\'=: ]+)[^ ,}"\']+', r'\1[REDACTED]', line)
                  selected.append(line[:1600])
          p=Path('docs/runtime/di-worker-runtime-diagnostic.txt')
          with p.open('a',encoding='utf-8') as f:
              f.write('WORKER_LIFECYCLE_LOG_COUNT='+str(len(selected))+'\n')
              f.write('WORKER_LIFECYCLE_LOGS_BEGIN\n')
              for line in selected[-120:]: f.write(line+'\n')
              f.write('WORKER_LIFECYCLE_LOGS_END\n')
          PY
          if (( rc != 0 )); then
            echo "RAILWAY_LOG_COMMAND_FAILED=$(tail -n 1 /tmp/log.err | cut -c1-500)" >> docs/runtime/di-worker-runtime-diagnostic.txt
          fi

      - name: Record diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/di-worker-runtime-diagnostic.txt
          git commit -m 'docs(dev): record Aadhaar extraction runtime diagnostic [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
