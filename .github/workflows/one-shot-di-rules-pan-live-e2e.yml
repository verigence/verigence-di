name: One-shot DI Rules PAN live E2E

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-di-rules-pan-live-e2e.yml'

permissions:
  contents: write

jobs:
  pan-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      DI_E2E_TENANT_ID: 70c5661e-bab2-46e7-8199-0f9c32acbac3
      DI_E2E_TOKEN: mock.70c5661e-bab2-46e7-8199-0f9c32acbac3.e2e-di-rules.TENANT_ADMIN
      DI_E2E_POLL_TIMEOUT: '300'
      DI_E2E_POLL_INTERVAL: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling and DI test dependencies
        working-directory: backend
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev]'
          npm install --global @railway/cli
      - name: Resolve live DI DEV endpoint and enforce real Document AI
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service di-api --json >/dev/null
          railway variable list --service di-api --environment dev --json >/tmp/di.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          v=json.loads(Path('/tmp/di.json').read_text())
          d=str(v.get('RAILWAY_PUBLIC_DOMAIN') or v.get('RAILWAY_STATIC_URL') or '').strip()
          if not d:
              raise SystemExit('DI DEV has no public domain')
          if not d.startswith(('http://','https://')):
              d='https://'+d
          mock=str(v.get('DI_DOCAI_MOCK') or '').strip().lower()
          if mock in {'1','true','yes','on'}:
              raise SystemExit('DI_DOCAI_MOCK is enabled in DEV; refusing to call this a real extraction E2E')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('DI_E2E_BASE_URL='+d.rstrip('/')+'\n')
          print('DI_E2E_BASE_URL='+d.rstrip('/'))
          print('DI_DOCAI_MOCK='+('false/unset' if not mock else mock))
          PY
      - name: Run real PAN upload and extraction E2E
        working-directory: backend
        shell: bash
        run: |
          set +e
          mkdir -p ../docs/runtime
          python -m e2e.di_rules \
            --scenario e2e/scenarios/pan-extraction.json \
            --report ../docs/runtime/di-rules-pan-e2e.json \
            2>&1 | tee ../docs/runtime/di-rules-pan-e2e.log
          rc=${PIPESTATUS[0]}
          {
            echo 'DI_RULES_PAN_LIVE_E2E'
            echo 'ENVIRONMENT=DEV'
            echo "TENANT_ID=$DI_E2E_TENANT_ID"
            echo "BASE_URL=$DI_E2E_BASE_URL"
            echo "EXIT_CODE=$rc"
            if (( rc == 0 )); then echo 'RESULT=PASS'; else echo 'RESULT=FAIL'; fi
          } > ../docs/runtime/di-rules-pan-e2e.txt
          exit "$rc"
      - name: Record non-secret E2E evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/di-rules-pan-e2e.txt || true
          git add docs/runtime/di-rules-pan-e2e.json || true
          git add docs/runtime/di-rules-pan-e2e.log || true
          git commit -m 'docs(dev): record live PAN DI E2E [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
