name: One-shot Schema V2 sandbox SQL gate

on:
  push:
    branches: [feature/schema-v2-document-extraction]
    paths:
      - '.github/workflows/one-shot-schema-v2-sandbox-sql-gate.yml'
      - 'backend/alembic/versions/0012_testbench_extraction_profiles.py'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: di-dev
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SERVICE: verigence-audit-core
      SANDBOX_HOST: ep-royal-pond-ayci3m0f-pooler.c-5.us-east-2.aws.neon.tech
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/schema-v2-document-extraction
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SQL and Railway clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          npm install --global @railway/cli >/dev/null

      - name: Resolve sandbox connection without storing credentials
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$SERVICE" --json >/dev/null
          railway variable list --service "$SERVICE" --environment dev --json >/tmp/audit-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode

          values=json.loads(Path('/tmp/audit-vars.json').read_text())
          raw=str(values.get('DATABASE_URL') or '').strip()
          if not raw:
              raise SystemExit('Audit Core DATABASE_URL is unavailable from Railway DEV')
          raw=raw.replace('postgresql+asyncpg://','postgresql://',1).replace('postgres+asyncpg://','postgresql://',1)
          parts=urlsplit(raw)
          if not parts.username:
              raise SystemExit('Audit Core DATABASE_URL has no database role')
          auth=parts.username
          if parts.password is not None:
              auth += ':' + parts.password
          netloc=auth + '@' + os.environ['SANDBOX_HOST']
          query=dict(parse_qsl(parts.query, keep_blank_values=True))
          query.pop('ssl', None)
          query['sslmode']='require'
          sandbox=urlunsplit(('postgresql',netloc,parts.path or '/neondb',urlencode(query),''))
          Path('/tmp/sandbox-url').write_text(sandbox)
          print('SANDBOX_CONNECTION=RESOLVED')
          print('SANDBOX_DB_ROLE='+parts.username)
          print('SANDBOX_HOST='+os.environ['SANDBOX_HOST'])
          PY
          echo "::add-mask::$(cat /tmp/sandbox-url)"

      - name: Inspect migration baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat /tmp/sandbox-url)"
          version="$(psql "$url" -Atqc "SELECT version_num FROM docintel.alembic_version LIMIT 1" 2>/dev/null || true)"
          extraction_key="$(psql "$url" -Atqc "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='docintel' AND table_name='extraction_profile_fields' AND column_name='extraction_key') THEN 'YES' ELSE 'NO' END")"
          fact_role="$(psql "$url" -Atqc "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='docintel' AND table_name='extracted_facts' AND column_name='fact_role') THEN 'YES' ELSE 'NO' END")"
          echo "DI_ALEMBIC_VERSION=${version:-MISSING}"
          echo "EXTRACTION_KEY_COLUMN=$extraction_key"
          echo "FACT_ROLE_COLUMN=$fact_role"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "extraction_key=${extraction_key}" >> "$GITHUB_OUTPUT"

      - name: Apply normal DI migration chain through Schema V2
        if: (steps.baseline.outputs.version == '0008' || steps.baseline.outputs.version == '0017') && steps.baseline.outputs.extraction_key == 'NO'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          export DI_DATABASE_URL="$(cat /tmp/sandbox-url)"
          python -m pip install -q uv
          uv pip install --system -e '.[dev]' >/dev/null
          echo "MIGRATING_FROM=${{ steps.baseline.outputs.version }}"
          alembic upgrade 0020
          echo 'SCHEMA_V2_MIGRATION_APPLY=PASS'

      - name: Reject unsafe migration baseline
        if: steps.baseline.outputs.version != '0008' && steps.baseline.outputs.version != '0017' && steps.baseline.outputs.version != '0020'
        shell: bash
        run: |
          echo "::error::Unexpected sandbox DI Alembic version '${{ steps.baseline.outputs.version }}'. Refusing to stamp or guess."
          exit 1

      - name: Run read-only SQL gate
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat /tmp/sandbox-url)"
          psql "$url" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN TRANSACTION READ ONLY;

          DO $$
          DECLARE
              v_version text;
              v_bad int;
          BEGIN
              SELECT version_num INTO v_version FROM docintel.alembic_version LIMIT 1;
              IF v_version <> '0020' THEN
                  RAISE EXCEPTION 'SQL GATE FAIL: DI Alembic version %, expected 0020', v_version;
              END IF;
              RAISE NOTICE 'PASS: DI Alembic version = 0020';

              IF NOT EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema='docintel' AND table_name='extraction_profile_fields' AND column_name='extraction_key'
              ) THEN RAISE EXCEPTION 'SQL GATE FAIL: extraction_key column missing'; END IF;
              IF NOT EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema='docintel' AND table_name='extracted_facts' AND column_name='fact_role'
              ) THEN RAISE EXCEPTION 'SQL GATE FAIL: extracted_facts.fact_role missing'; END IF;
              RAISE NOTICE 'PASS: DI role/schema columns present';

              WITH expected(document_type_key, expected_fields) AS (
                  VALUES ('gst_certificate',17),('corporate_id',18),('bank_approval_letter',36),('valuation_report',42)
              ), actual AS (
                  SELECT dt.document_type_key, ep.status, count(epf.profile_field_id)::int actual_fields
                  FROM docintel.extraction_profiles ep
                  JOIN docintel.document_types dt ON dt.document_type_id=ep.document_type_id
                  LEFT JOIN docintel.extraction_profile_fields epf ON epf.profile_id=ep.profile_id
                  WHERE ep.profile_name='Schema V2 Wave 1 Draft'
                  GROUP BY dt.document_type_key, ep.status
              )
              SELECT count(*) INTO v_bad
              FROM expected e LEFT JOIN actual a USING(document_type_key)
              WHERE a.document_type_key IS NULL OR a.status <> 'DRAFT' OR a.actual_fields <> e.expected_fields;
              IF v_bad <> 0 THEN RAISE EXCEPTION 'SQL GATE FAIL: Wave-1 DRAFT profile count/status mismatch (% rows)', v_bad; END IF;
              RAISE NOTICE 'PASS: Wave-1 DRAFT counts 17/18/36/42';

              SELECT count(*) INTO v_bad
              FROM docintel.extraction_profile_fields epf
              JOIN docintel.extraction_profiles ep ON ep.profile_id=epf.profile_id
              JOIN docintel.document_types dt ON dt.document_type_id=ep.document_type_id
              JOIN docintel.canonical_fields cf ON cf.canonical_field_id=epf.canonical_field_id
              WHERE ep.profile_name='Schema V2 Wave 1 Draft'
                AND cf.field_key='chassis_number'
                AND ((dt.document_type_key='bank_approval_letter' AND epf.fact_role_override <> 'SUBJECT_VEHICLE')
                  OR (dt.document_type_key='valuation_report' AND epf.fact_role_override <> 'EXCHANGE_VEHICLE'));
              IF v_bad <> 0 THEN RAISE EXCEPTION 'SQL GATE FAIL: chassis role isolation mismatch'; END IF;
              RAISE NOTICE 'PASS: subject/exchange chassis roles isolated';

              SELECT count(*) INTO v_bad
              FROM docintel.extraction_profile_fields epf
              JOIN docintel.extraction_profiles ep ON ep.profile_id=epf.profile_id
              WHERE ep.profile_name='Schema V2 Wave 1 Draft'
                AND epf.extraction_key IN ('financier_type','valuation_platform');
              IF v_bad <> 0 THEN RAISE EXCEPTION 'SQL GATE FAIL: derived/reference fields incorrectly registered for extraction'; END IF;
              RAISE NOTICE 'PASS: financier_type and valuation_platform excluded from extraction';

              SELECT count(*) INTO v_bad FROM (
                  SELECT epf.profile_id, epf.canonical_field_id, epf.fact_role_override, count(*)
                  FROM docintel.extraction_profile_fields epf
                  JOIN docintel.extraction_profiles ep ON ep.profile_id=epf.profile_id
                  WHERE ep.profile_name='Schema V2 Wave 1 Draft'
                  GROUP BY 1,2,3 HAVING count(*) > 1
              ) d;
              IF v_bad <> 0 THEN RAISE EXCEPTION 'SQL GATE FAIL: duplicate canonical+role mappings'; END IF;
              RAISE NOTICE 'PASS: no duplicate canonical+role mappings';

              SELECT count(*) INTO v_bad
              FROM (VALUES
                  ('schema_v2.structured_literal_parse'),
                  ('schema_v2.scalar_literal_parse'),
                  ('schema_v2.date_iso8601')
              ) x(rule_key)
              WHERE NOT EXISTS (
                  SELECT 1 FROM docintel.normalization_rule_catalog n
                  WHERE n.rule_key=x.rule_key AND n.status='ACTIVE'
              );
              IF v_bad <> 0 THEN RAISE EXCEPTION 'SQL GATE FAIL: Schema V2 normalizer rule(s) inactive/missing'; END IF;
              IF NOT EXISTS (SELECT 1 FROM docintel.validation_rule_catalog WHERE rule_key='schema_v2.structured_shape' AND status='ACTIVE') THEN
                  RAISE EXCEPTION 'SQL GATE FAIL: structured validator inactive/missing';
              END IF;
              RAISE NOTICE 'PASS: Schema V2 deterministic rules ACTIVE';

              IF to_regclass('auditcore.evidence_facts') IS NULL THEN
                  RAISE EXCEPTION 'SQL GATE FAIL: auditcore.evidence_facts missing';
              END IF;
              SELECT count(*) INTO v_bad FROM (VALUES
                  ('fact_role'),('di_value_version_no'),('di_extracted_fact_id'),('di_processing_run_id'),
                  ('di_extraction_profile_id'),('di_extraction_profile_version'),('di_invocation_id'),('di_pipeline_version')
              ) x(column_name)
              WHERE NOT EXISTS (
                  SELECT 1 FROM information_schema.columns c
                  WHERE c.table_schema='auditcore' AND c.table_name='evidence_facts' AND c.column_name=x.column_name
              );
              IF v_bad <> 0 THEN RAISE EXCEPTION 'SQL GATE FAIL: Audit Core lineage columns missing (%)', v_bad; END IF;
              RAISE NOTICE 'PASS: Audit Core role/lineage columns present';
          END $$;

          SELECT 'OVERALL_SQL_GATE=PASS' AS result;
          ROLLBACK;
          SQL
