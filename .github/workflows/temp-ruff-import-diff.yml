name: TEMP Ruff import diff

on:
  push:
    branches:
      - fix/di-safe-error-contract-20260912

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff==0.16.7
      - name: Show Ruff import fixes
        run: ruff check --select I001 --fix --diff src/verigence/di/logging_config.py src/verigence/di/runtime_errors.py
